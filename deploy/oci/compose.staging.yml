# Isolated AEP-X staging: does not reference the production Compose project.
# Explicitly run with: docker compose -p aepx-oci-staging -f deploy/oci/compose.staging.yml ...
name: aepx-oci-staging
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128
    environment:
      POSTGRES_DB: aepx
      POSTGRES_USER: aepx
      POSTGRES_PASSWORD: ${AEPX_POSTGRES_PASSWORD:?Set AEPX_POSTGRES_PASSWORD}
    volumes:
      - staging-postgres:/var/lib/postgresql/data
      - ../../schemas/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aepx -d aepx"]
      interval: 10s
      retries: 10
  redis:
    image: redis:7
    restart: unless-stopped
    mem_limit: 192m
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
  identity:
    mem_limit: 384m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    environment:
      AEPX_SECURE_MODE: "true"
      AEPX_INTERNAL_SERVICE_KEY: ${AEPX_INTERNAL_SERVICE_KEY:?Set AEPX_INTERNAL_SERVICE_KEY}
      AEPX_REGISTRY_IDENTITY_KEY: ${AEPX_REGISTRY_IDENTITY_KEY:-}
      IDENTITY_JWT_SECRET: ${AEPX_IDENTITY_JWT_SECRET:?Set AEPX_IDENTITY_JWT_SECRET}
    build:
      context: ../../services/identity
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 10s
      timeout: 7s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
  trust:
    mem_limit: 384m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    build:
      context: ../../services/trust
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 10s
      timeout: 7s
      retries: 12
      start_period: 20s
    environment:
      AEPX_REQUIRE_DATABASE: "true"
      AEPX_TRUST_WRITE_KEY: ${AEPX_TRUST_WRITE_KEY:-}
      AEPX_INTERNAL_SERVICE_KEY: ${AEPX_INTERNAL_SERVICE_KEY:?Set AEPX_INTERNAL_SERVICE_KEY}
      DATABASE_URL: postgresql://aepx:${AEPX_POSTGRES_PASSWORD:?Set AEPX_POSTGRES_PASSWORD}@postgres:5432/aepx
    depends_on:
      postgres:
        condition: service_healthy
  registry:
    mem_limit: 384m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    build:
      context: ../../services/registry
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 10s
      timeout: 7s
      retries: 12
      start_period: 20s
    environment:
      AEPX_REQUIRE_DATABASE: "true"
      DATABASE_URL: postgresql://aepx:${AEPX_POSTGRES_PASSWORD:?Set AEPX_POSTGRES_PASSWORD}@postgres:5432/aepx
      IDENTITY_URL: http://identity:8000
      AEPX_REGISTRY_IDENTITY_KEY: ${AEPX_REGISTRY_IDENTITY_KEY:-}
      AEPX_REGISTRY_WRITE_KEY: ${AEPX_REGISTRY_WRITE_KEY:-}
      AEPX_INTERNAL_SERVICE_KEY: ${AEPX_INTERNAL_SERVICE_KEY:?Set AEPX_INTERNAL_SERVICE_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
volumes:
  staging-postgres:
