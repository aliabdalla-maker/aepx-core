# Include this inside the existing softwareequality.com HTTPS server block.
# It serves AEP-X without replacing the main Software Equality website.

location = /aep-x {
    return 301 /aep-x/;
}

location /aep-x/ {
    root /var/www/softwareequality.com;
    try_files $uri $uri/ /aep-x/index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}
