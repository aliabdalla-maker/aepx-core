# Staging only. Requires OCI VM with Docker Compose, private ingress and managed secrets.
# Only gateway is loopback-bound; SSH tunnel or authenticated reverse proxy required.
# Never use the root reference docker-compose.yml in production.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: aepx
      POSTGRES_USER: aepx
      POSTGRES_PASSWORD: ${AEPX_POSTGRES_PASSWORD:?set AEPX_POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../schemas/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aepx -d aepx"]
      interval: 10s
      retries: 8
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server","--save","60","1","--appendonly","yes"]
    volumes:
      - redisdata:/data
  identity:
    build: ../../services/identity
    restart: unless-stopped
    depends_on: [postgres]
  trust:
    build: ../../services/trust
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://aepx:${AEPX_POSTGRES_PASSWORD:?set AEPX_POSTGRES_PASSWORD}@postgres:5432/aepx
    depends_on: [postgres]
  registry:
    build: ../../services/registry
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://aepx:${AEPX_POSTGRES_PASSWORD:?set AEPX_POSTGRES_PASSWORD}@postgres:5432/aepx
      IDENTITY_URL: http://identity:8000
    depends_on: [postgres,identity]
  memory:
    build: ../../services/memory
    restart: unless-stopped
    depends_on: [postgres,redis]
  cache:
    build: ../../services/cache
    restart: unless-stopped
    depends_on: [redis]
  governance:
    build: ../../services/governance
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://aepx:${AEPX_POSTGRES_PASSWORD:?set AEPX_POSTGRES_PASSWORD}@postgres:5432/aepx
    depends_on: [postgres]
  gateway:
    build: ../../services/gateway
    restart: unless-stopped
    ports: ["127.0.0.1:8000:8000"]
    depends_on: [identity,trust,registry,memory,cache,governance]
volumes:
  pgdata:
  redisdata:
