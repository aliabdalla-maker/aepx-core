org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Deployment settings (identifiers, not secrets). Override with -P or ~/.gradle/gradle.properties.
aepx.apiBaseUrl=https://ide-api.example.com
aepx.tenant=your-tenant-id
aepx.oidcIssuer=https://your-issuer.example.com
aepx.oidcClientId=aepx-android-companion
# Google Play subscription product (base plan: monthly, GBP 4.99). Must match GOOGLE_PLAY_PRODUCT_ID on the backend.
aepx.playSubscriptionId=aepx_pro_monthly
