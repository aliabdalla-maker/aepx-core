# AEP-X reference deployment — one file, everything a developer runs on day
# one (Instructional Manual §3.1), extended with the Microservices-Guide's
# Wave 2 additions (Neo4j, Kafka, discovery/workflow/safety/governance) and
# this repo's own v2 additions (knowledge/verification/cost-optimiser/
# ml-integration) plus the SOA Connector Bus layer.
#
#   docker compose up --build
#
services:
  # ---- Infrastructure ----
  # Self-hosted model server behind the aiplatform 'ml' connector
  # (connectors/aiplatform/app/adapters.py). Uses a 1B-parameter model by
  # default to keep disk/RAM modest on constrained dev machines — swap
  # OLLAMA_MODEL for a larger one once headroom allows.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports: ["11434:11434"]
    volumes: ["ollama-models:/root/.ollama"]
    environment:
      # Ollama's default (5m idle) unloads the model between chats on a
      # normal-use console, forcing a cold reload that's measured as slow
      # as 88s on this box — well past the aiplatform connector's 25s
      # timeout, which is what was intermittently surfacing as "could not
      # reach the platform" even though every other part of the stack was
      # healthy. Keep it loaded indefinitely instead.
      - OLLAMA_KEEP_ALIVE=-1
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      retries: 10
      start_period: 20s

  postgres:
    # pgvector/pgvector:pg16 = postgres:16 + the vector extension, which
    # schemas/sql/002_v2_additions.sql requires for knowledge.embeddings.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: aepx
      POSTGRES_USER: aepx
      POSTGRES_PASSWORD: aepx_dev_only
    ports: ["5432:5432"]
    volumes: ["./schemas/sql:/docker-entrypoint-initdb.d"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U aepx"], interval: 5s, retries: 5 }

  redis:
    image: redis:7
    restart: unless-stopped
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 5 }

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/aepx_dev_only
    ports: ["7474:7474", "7687:7687"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474"]
      interval: 10s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    restart: unless-stopped
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      # KRaft requires a base64-encoded 16-byte UUID (22 chars), not an
      # arbitrary string — the original guide's "aepx-dev-cluster" value
      # crashes the broker at preflight.
      - CLUSTER_ID=--uOo48KTJORT8HLBa3jFg
    ports: ["9092:9092"]

  # ---- Tier 1: Foundational (synchronous) ----
  identity:
    build: ./services/identity
    restart: unless-stopped
    ports: ["8001:8000"]
    depends_on: [postgres]

  trust:
    build: ./services/trust
    restart: unless-stopped
    ports: ["8002:8000"]
    environment:
      - DATABASE_URL=postgresql://aepx:aepx_dev_only@postgres:5432/aepx
    depends_on: [postgres]

  registry:
    build: ./services/registry
    restart: unless-stopped
    ports: ["8003:8000"]
    environment:
      - DATABASE_URL=postgresql://aepx:aepx_dev_only@postgres:5432/aepx
      # Mints a did:key for every agent that doesn't supply one (RFC-0006) —
      # best-effort: Identity being unreachable never blocks registration.
      - IDENTITY_URL=http://identity:8000
    depends_on: [postgres, identity]

  memory:
    build: ./services/memory
    restart: unless-stopped
    ports: ["8004:8000"]
    depends_on: [postgres, redis]

  cache:
    build: ./services/cache
    restart: unless-stopped
    ports: ["8005:8000"]
    depends_on: [redis]

  discovery:
    build: ./services/discovery
    restart: unless-stopped
    ports: ["8006:8000"]
    depends_on: [registry, trust, redis]

  # ---- Tier 2: Orchestration (event-driven) ----
  workflow:
    build: ./services/workflow
    restart: unless-stopped
    ports: ["8007:8000"]
    depends_on: [registry, memory, neo4j, kafka]

  safety:
    build: ./services/safety
    restart: unless-stopped
    ports: ["8008:8000"]
    depends_on: [trust, kafka]

  governance:
    build: ./services/governance
    restart: unless-stopped
    ports: ["8009:8000"]
    environment:
      - DATABASE_URL=postgresql://aepx:aepx_dev_only@postgres:5432/aepx
      # RFC-0006, all optional — leave unset (the default) and Governance
      # anchors the audit trail with its own local SHA-256 hash chain and
      # enforces the in-process seed policy, no chain required. Set all
      # three LEDGER_* vars to also anchor on an EVM chain
      # (governance/contracts/AEPXAnchor.sol); set POLICY_CONTRACT_ADDRESS
      # too to let an AEPXPolicyRegistry.sol deployment set the risk-level
      # ceiling instead of the seed policy. See governance/contracts/README.md.
      - LEDGER_RPC_URL=${LEDGER_RPC_URL:-}
      - LEDGER_CONTRACT_ADDRESS=${LEDGER_CONTRACT_ADDRESS:-}
      - LEDGER_PRIVATE_KEY=${LEDGER_PRIVATE_KEY:-}
      - POLICY_CONTRACT_ADDRESS=${POLICY_CONTRACT_ADDRESS:-}
    depends_on: [kafka, postgres]

  knowledge:
    build: ./services/knowledge
    restart: unless-stopped
    ports: ["8010:8000"]
    depends_on: [postgres]

  verification:
    build: ./services/verification
    restart: unless-stopped
    ports: ["8011:8000"]
    depends_on: [knowledge, kafka]

  cost-optimiser:
    build: ./services/cost-optimiser
    restart: unless-stopped
    ports: ["8012:8000"]
    environment:
      - TRUST_URL=http://trust:8000
    depends_on: [trust, redis]

  ml-integration:
    build: ./services/ml-integration
    restart: unless-stopped
    ports: ["8013:8000"]
    depends_on: [kafka]

  # ---- RFC-0008: chain->AI oracle bridge ----
  # Off-chain half of the AI<->blockchain bridge. Its /oracle/decide pipeline
  # (governed AI call via the bus + Verification scoring) is always on;
  # the on-chain listener that fulfils AEPXOracle.sol requests only runs when
  # all three ORACLE_* vars are set (see governance/contracts/README.md).
  # Unset by default => listener idle, never a 5xx (RFC-0008 §3).
  oracle-bridge:
    build: ./services/oracle-bridge
    restart: unless-stopped
    ports: ["8015:8000"]
    environment:
      - CONNECTOR_BUS_URL=http://connector-bus:8000
      - VERIFICATION_URL=http://verification:8000
      - ORACLE_AI_CONNECTOR=${ORACLE_AI_CONNECTOR:-ml}
      - ORACLE_RPC_URL=${ORACLE_RPC_URL:-}
      - ORACLE_CONTRACT_ADDRESS=${ORACLE_CONTRACT_ADDRESS:-}
      - ORACLE_PRIVATE_KEY=${ORACLE_PRIVATE_KEY:-}
    depends_on: [connector-bus, verification, kafka]

  # ---- Gateway ----
  gateway:
    build: ./services/gateway
    restart: unless-stopped
    ports: ["8000:8000"]
    environment:
      - IDENTITY_URL=http://identity:8000
      - TRUST_URL=http://trust:8000
      - REGISTRY_URL=http://registry:8000
      - MEMORY_URL=http://memory:8000
      - CACHE_URL=http://cache:8000
      - DISCOVERY_URL=http://discovery:8000
      - WORKFLOW_URL=http://workflow:8000
      - SAFETY_URL=http://safety:8000
      - GOVERNANCE_URL=http://governance:8000
      - KNOWLEDGE_URL=http://knowledge:8000
      - VERIFICATION_URL=http://verification:8000
      - COST_OPTIMISER_URL=http://cost-optimiser:8000
      - ML_INTEGRATION_URL=http://ml-integration:8000
      - ORACLE_BRIDGE_URL=http://oracle-bridge:8000
      - CONNECTOR_BUS_URL=http://connector-bus:8000
    depends_on: [identity, trust, registry, memory, cache, discovery, workflow, safety, governance]

  # ---- SOA layer: AEP-X Connector Bus (docs/SOA-Architecture.md) ----
  # Gated on trust + governance being healthy first (see docs/SOA-Architecture.md §5) —
  # bring these up with `docker compose up -d trust governance` before
  # starting the bus in a fresh environment.
  connector-bus:
    build: ./connector-bus
    restart: unless-stopped
    ports: ["8020:8000"]
    environment:
      - TRUST_URL=http://trust:8000
      - GOVERNANCE_URL=http://governance:8000
      - BRAIN_URL=http://brain:8000
    volumes:
      - ./connectors/catalogue.json:/app/catalogue.json:ro
    depends_on: [trust, governance, brain]

  # ---- Brain: self-healing + self-learning monitor ----
  # Watches every core service's health, re-warms a cold Ollama, and runs a
  # circuit breaker per connector learned from Governance's real audit
  # history (docs/Operational-Manual.html §... Brain section). HTTP-only —
  # deliberately does NOT get docker.sock access (that's root-equivalent
  # host control); every action it takes is published to Kafka so
  # Governance's audit log captures it (Law 8).
  brain:
    build: ./services/brain
    restart: unless-stopped
    ports: ["8014:8000"]
    environment:
      - DATABASE_URL=postgresql://aepx:aepx_dev_only@postgres:5432/aepx
      - GOVERNANCE_URL=http://governance:8000
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:1b
      - BRAIN_POLL_INTERVAL=20
    depends_on: [postgres, governance, ollama]

  # ---- 11 category connector services, 107 connectors total ----
  # One coarse-grained service per category, one adapter per connector
  # (SOA-Architecture.md §3.1). The catalogue (connectors/catalogue.json)
  # is the single source of truth; docs/Connector-Catalogue.md lists all 107.
  connector-enterprise:
    build: ./connectors/enterprise
    restart: unless-stopped
    ports: ["8021:8000"]
    volumes: ["./connectors/catalogue.json:/app/catalogue.json:ro"]

  connector-aiplatform:
    build: ./connectors/aiplatform
    restart: unless-stopped
    ports: ["8022:8000"]
    volumes: ["./connectors/catalogue.json:/app/catalogue.json:ro"]
    environment:
      # The 'ml' connector's specialized adapter targets a self-hosted
      # open-weights server (Ollama reference) — see its adapters.py.
      # Falls back to a stub response automatically if Ollama or the model
      # isn't ready (e.g. first-run pull still in progress).
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:1b
    depends_on: [ollama]

  connector-devtools:
    build: ./connectors/devtools
    restart: unless-stopped
    ports: ["8023:8000"]
    volumes: ["./connectors/catalogue.json:/app/catalogue.json:ro"]

  connector-productivity:
    build: ./connectors/productivity
    restart: unless-stopped
    ports: ["8024:8000"]
    volumes: ["./connectors/catalogue.json:/app/catalogue.json:ro"]

  connector-data:
    build: ./connectors/data
    restart: unless-stopped
    ports: ["8025:8000"]
    volumes: ["./connectors/catalogue.json:/app/catalogue.json:ro"]

  connector-messaging:
    build: ./connectors/messaging
    restart: unless-stopped
    ports: ["8026:8000"]
    volumes: ["./connectors/catalogue.json:/app/catalogue.json:ro"]

  connector-industrial:
    build: ./connectors/industrial
    restart: unless-stopped
    ports: ["8027:8000"]
    volumes: ["./connectors/catalogue.json:/app/catalogue.json:ro"]

  connector-cloud:
    build: ./connectors/cloud
    restart: unless-stopped
    ports: ["8028:8000"]
    volumes: ["./connectors/catalogue.json:/app/catalogue.json:ro"]

  connector-government:
    build: ./connectors/government
    restart: unless-stopped
    ports: ["8029:8000"]
    volumes: ["./connectors/catalogue.json:/app/catalogue.json:ro"]

  connector-education:
    build: ./connectors/education
    restart: unless-stopped
    ports: ["8030:8000"]
    volumes: ["./connectors/catalogue.json:/app/catalogue.json:ro"]

  connector-blockchain:
    build: ./connectors/blockchain
    restart: unless-stopped
    ports: ["8031:8000"]
    volumes: ["./connectors/catalogue.json:/app/catalogue.json:ro"]
    environment:
      # 'ethereum's specialized adapter speaks generic EVM JSON-RPC — point
      # it at any Ethereum-compatible chain, or a local Anvil/Hardhat devnet
      # (see governance/contracts/README.md). Unset by default: the adapter
      # degrades to a clean stub response, never a 5xx (see its adapters.py).
      - EVM_RPC_URL=${EVM_RPC_URL:-http://localhost:8545}

  # ---- Console: the LLM / machine-learning box (web GUI) ----
  # Chat routes through the Connector Bus (trust + policy + audit);
  # uploads (files/folders/images/videos) persist in the console-uploads volume.
  console:
    build: ./console
    restart: unless-stopped
    ports: ["8080:8000"]
    environment:
      - CONNECTOR_BUS_URL=http://connector-bus:8000
      - REGISTRY_URL=http://registry:8000
      - TRUST_URL=http://trust:8000
      - GOVERNANCE_URL=http://governance:8000
    volumes:
      - console-uploads:/data/uploads
    depends_on: [connector-bus, registry, trust, governance]

  # ---- RFC-0007: testing & utilisation platform ----
  # Both build from the repo root so the SDK (sdk/python) — which carries
  # the protocol client, plugins, and conformance engine — installs from
  # source into their images.
  workbench:
    build: { context: ., dockerfile: platform/workbench/Dockerfile }
    restart: unless-stopped
    ports: ["8081:8000"]
    environment:
      - GATEWAY_URL=http://gateway:8000
      - IDENTITY_URL=http://identity:8000
      - TRUST_URL=http://trust:8000
      - REGISTRY_URL=http://registry:8000
      - GOVERNANCE_URL=http://governance:8000
      - CONNECTOR_BUS_URL=http://connector-bus:8000
    depends_on: [gateway, connector-bus]

  conformance:
    build: { context: ., dockerfile: platform/conformance/Dockerfile }
    restart: unless-stopped
    ports: ["8082:8000"]
    environment:
      - GATEWAY_URL=http://gateway:8000
      - IDENTITY_URL=http://identity:8000
      - TRUST_URL=http://trust:8000
      - REGISTRY_URL=http://registry:8000
      - GOVERNANCE_URL=http://governance:8000
      - CONNECTOR_BUS_URL=http://connector-bus:8000
    depends_on: [gateway, connector-bus]

  # ---- AEP-X Console: one live GUI over the whole platform ----
  # Overview/health, connectors, trust & DID, memory & workflows, governance
  # + audit + ledger, the RFC-0008 AI<->chain bridge, ML/Brain, and an LLM
  # box — all governed through the bus/SDK. http://localhost:8083
  aepx-console:
    build: { context: ., dockerfile: platform/aepx-console/Dockerfile }
    restart: unless-stopped
    ports: ["8083:8000"]
    environment:
      - GATEWAY_URL=http://gateway:8000
      - IDENTITY_URL=http://identity:8000
      - TRUST_URL=http://trust:8000
      - REGISTRY_URL=http://registry:8000
      - MEMORY_URL=http://memory:8000
      - CACHE_URL=http://cache:8000
      - DISCOVERY_URL=http://discovery:8000
      - WORKFLOW_URL=http://workflow:8000
      - SAFETY_URL=http://safety:8000
      - GOVERNANCE_URL=http://governance:8000
      - KNOWLEDGE_URL=http://knowledge:8000
      - VERIFICATION_URL=http://verification:8000
      - COST_OPTIMISER_URL=http://cost-optimiser:8000
      - ML_INTEGRATION_URL=http://ml-integration:8000
      - BRAIN_URL=http://brain:8000
      - CONNECTOR_BUS_URL=http://connector-bus:8000
      - ORACLE_BRIDGE_URL=http://oracle-bridge:8000
      - CONNECTOR_URL_BLOCKCHAIN=http://connector-blockchain:8000
    depends_on: [gateway, connector-bus, governance, verification, oracle-bridge]

volumes:
  console-uploads:
  ollama-models:
