# Opt-in live-chain overlay (RFC-0006 §9 / RFC-0008 §9).
#
# The default stack runs with NO chain — every on-chain path degrades cleanly
# (that's the whole design). This overlay adds a local `anvil` EVM devnet and
# points Governance, the oracle-bridge, and the blockchain connector at it so
# the on-chain paths run for real. Nothing here changes the default path.
#
# Bring it up (three steps — anvil must be live before contracts can deploy):
#   1. docker compose -f docker-compose.yml -f docker-compose.chain.yml up -d anvil
#   2. python scripts/deploy_contracts.py --rpc http://localhost:8545
#        -> deploys AEPXAnchor / AEPXPolicyRegistry / AEPXOracle and writes .env.chain
#   3. docker compose --env-file .env.chain -f docker-compose.yml -f docker-compose.chain.yml up --build
#
# In-network services reach the node at http://anvil:8545 (overridden below);
# the host-side deploy script uses http://localhost:8545. Contract addresses
# and the signing key come from .env.chain (--env-file) via the ${...} refs
# already present in docker-compose.yml.

services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:stable
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--chain-id", "31337", "--block-time", "2"]
    restart: unless-stopped
    ports: ["8545:8545"]

  governance:
    environment:
      - LEDGER_RPC_URL=http://anvil:8545
    depends_on: [kafka, postgres, anvil]

  oracle-bridge:
    environment:
      - ORACLE_RPC_URL=http://anvil:8545
    depends_on: [connector-bus, verification, kafka, anvil]

  connector-blockchain:
    environment:
      # EVM_RPC_URL points in-cluster at anvil; EVM_PRIVATE_KEY enables
      # governed contract_write (defaults to anvil's deterministic account #0
      # unless overridden via .env.chain).
      - EVM_RPC_URL=http://anvil:8545
      - EVM_PRIVATE_KEY=${EVM_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
