# Add inside the existing TLS server block for softwareequality.com on the OCI VM (manual, after approval).
location /apps/agentic-antivirus/ {
  proxy_pass http://127.0.0.1:18480/;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  limit_req zone=aav burst=40 nodelay;   # define: limit_req_zone $binary_remote_addr zone=aav:10m rate=20r/s;
}
