# Console container: static files + /api proxy to the control plane. TLS terminates at the host's
# existing reverse proxy (see nginx-host-location.conf); this listener is published on loopback only.
server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 110m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com; img-src 'self' data: blob: https:; frame-src https://googleads.g.doubleclick.net https://tpc.googlesyndication.com; connect-src 'self' https://pagead2.googlesyndication.com; style-src 'self' 'unsafe-inline'; font-src 'self'" always;
  location /api/ { proxy_pass http://control-plane:8000/; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https; proxy_read_timeout 60s; }
  location /_next/static/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri $uri/ $uri.html /404.html; }
}
