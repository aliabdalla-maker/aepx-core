# Pin the lint rule set explicitly so CI is reproducible and immune to ruff
# broadening its defaults between releases (ruff 0.16 added I001 import-sorting
# and S110 try/except/pass to the default set, which broke a previously-green
# CI even though no code changed). These four are ruff's long-standing default
# selection — the contract this codebase was written against:
#   E4/E7/E9 = pycodestyle errors (imports, statements, syntax)
#   F        = pyflakes (undefined names, unused imports, etc.)
# S110 in particular is intentional here: several paths swallow exceptions by
# design so audit/anchor/degrade logic never breaks the main flow.
[lint]
select = ["E4", "E7", "E9", "F"]
