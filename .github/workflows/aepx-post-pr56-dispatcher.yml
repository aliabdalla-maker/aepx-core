name: AEP-X HITL dispatcher safety regression
on:
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile changed modules
        run: python -m py_compile services/governance/app/hitl_dispatcher.py services/governance/app/hitl_outbox.py
      - name: Dispatcher and lease unit tests
        run: |
          python -m unittest discover -s tests -p 'test_aepx_hitl_dispatcher.py' -v
          python -m unittest discover -s tests -p 'test_aepx_hitl_outbox.py' -v
