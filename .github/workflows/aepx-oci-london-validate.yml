name: AEP-X OCI London plan validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'platform/saas-ide/infra/oci-london/**'
      - '.github/workflows/aepx-oci-london-validate.yml'
permissions:
  contents: read
concurrency:
  # Issue #370: bound queue fan-out. One running + one pending run per
  # workflow/event/ref; superseded branch and PR runs are cancelled.
  # master never cancels an in-progress run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - name: Run offline approval-gate unit tests
        working-directory: platform/saas-ide/infra/oci-london
        run: python3 -m unittest discover -v -p 'test_*.py'
      - name: Validate configuration without cloud credentials
        run: bash platform/saas-ide/infra/oci-london/validate.sh
