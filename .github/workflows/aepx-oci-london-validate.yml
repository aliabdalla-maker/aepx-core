name: AEP-X OCI London plan validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'platform/saas-ide/infra/oci-london/**'
      - '.github/workflows/aepx-oci-london-validate.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - name: Validate configuration without cloud credentials
        run: bash platform/saas-ide/infra/oci-london/validate.sh
