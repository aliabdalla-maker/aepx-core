name: AEP-X 100-cycle offline acceptance
on:
  push:
    branches:
      - 'fix/acceptance-evidence-gates-20261114'
    paths:
      - 'tools/run_acceptance_100_iterations.py'
      - 'tests/test_acceptance_100_runner.py'
      - 'tests/test_acceptance_evidence_integrity.py'
      - 'tools/verify_acceptance_evidence.py'
      - 'tools/verify_acceptance_cycle_report.py'
      - 'tests/test_acceptance_cycle_report.py'
      - 'tests/test_acceptance_cycle_mutations.py'
      - '.github/workflows/acceptance-100-cycles.yml'
  pull_request:
    paths:
      - 'tools/run_acceptance_100_iterations.py'
      - 'tests/test_acceptance_100_runner.py'
      - 'tests/test_acceptance_evidence_integrity.py'
      - 'tools/verify_acceptance_evidence.py'
      - 'tools/verify_acceptance_cycle_report.py'
      - 'tests/test_acceptance_cycle_report.py'
      - 'tests/test_acceptance_cycle_mutations.py'
      - '.github/workflows/acceptance-100-cycles.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aepx-100-cycle-${{ github.ref }}
  cancel-in-progress: false
jobs:
  acceptance-100-cycles:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preflight runner and test syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/run_acceptance_100_iterations.py tools/verify_acceptance_evidence.py tests/test_acceptance_evidence_integrity.py tests/test_acceptance_100_runner.py
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover("tests", pattern="test_acceptance_100_runner.py")
          count = suite.countTestCases()
          print(f"Runner self-tests discovered: {count}")
          if count < 19:
              raise SystemExit("Runner self-test coverage below required minimum of 19")
          PY
          python -m unittest discover -s tests -p 'test_acceptance_100_runner.py' -v
          python -m py_compile tools/verify_acceptance_cycle_report.py tests/test_acceptance_cycle_report.py
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover("tests", pattern="test_acceptance_cycle_report.py")
          if suite.countTestCases() < 18:
              raise SystemExit("Acceptance report verifier coverage below 18 tests")
          PY
          python -m unittest discover -s tests -p 'test_acceptance_cycle_report.py' -v
          python -m py_compile tests/test_acceptance_cycle_mutations.py
          python -m unittest discover -s tests -p 'test_acceptance_cycle_mutations.py' -v
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover("tests", pattern="test_acceptance_evidence_integrity.py")
          count = suite.countTestCases()
          print(f"Integrity tests discovered: {count}")
          if count < 42:
              raise SystemExit("Integrity test coverage below required minimum of 42")
          PY
      - name: Run up to 100 sequential acceptance cycles (stop on failure)
        shell: bash
        run: |
          set -euo pipefail
          python tools/run_acceptance_100_iterations.py --iterations 100 --output acceptance-100-iterations.json
      - name: Validate report provenance and completion
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_acceptance_cycle_report.py acceptance-100-iterations.json
      - name: Publish scoped result
        if: always()
        shell: bash
        run: |
          if [[ -f acceptance-100-iterations.json ]]; then
            python - <<'PY'
          import json, os
          try:
              with open('acceptance-100-iterations.json', encoding='utf-8') as handle:
                  data = json.load(handle)
              if not isinstance(data, dict):
                  raise ValueError("report root is not an object")
          except (OSError, ValueError, TypeError) as exc:
              data = {"requested": "unknown", "executed": "unknown", "all_passed": False,
                      "runs": [], "report_error": type(exc).__name__}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              if data.get("report_error"):
                  out.write(f"- Report unreadable: {data['report_error']}\n")
              out.write('## Offline acceptance repetition\n')
              out.write(f"- Cycles executed: {data.get('executed', 'unknown')} / {data.get('requested', 'unknown')}\n")
              out.write(f"- All passed: {data.get('all_passed') is True}\n")
              out.write(f"- Source commit: {data.get('source_commit') or 'unavailable'}\n")
              out.write(f"- Workflow run ID: {data.get('workflow_run_id') or 'unavailable'}\n")
              runs = data.get('runs')
              if not isinstance(runs, list):
                  runs = []
                  out.write('- Invalid cycle records: expected a list\n')
              failed = next((item for item in runs if not isinstance(item, dict) or item.get('passed') is not True), None)
              if failed is not None:
                  if not isinstance(failed, dict):
                      out.write('- First failed cycle: malformed record\n')
                  else:
                      out.write(f"- First failed cycle: {failed.get('iteration', 'unknown')}\n")
                      reason = failed.get('error') or failed.get('diagnostic_tail') or 'no diagnostic supplied'
                      detail = str(reason).replace(chr(10), ' ').replace(chr(13), ' ')[:1500]
                      out.write(f"- Failure detail (truncated): `{detail}`\n")

              out.write('- Independent acceptance: NOT ESTABLISHED\n')
              out.write('- Merge or deployment authorized: NO\n')
          PY
          else
            echo 'No completion report generated; treat execution as unverified' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aepx-100-cycle-offline-report
          retention-days: 7
          if-no-files-found: warn
          path: acceptance-100-iterations.json
