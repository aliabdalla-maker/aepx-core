name: AEP-X 100-cycle offline acceptance
on:
  push:
    branches:
      - 'fix/acceptance-evidence-gates-20261114'
    paths:
      - 'tools/run_acceptance_100_iterations.py'
      - 'tests/test_acceptance_100_runner.py'
      - 'tests/test_acceptance_evidence_integrity.py'
      - 'tools/verify_acceptance_evidence.py'
      - '.github/workflows/acceptance-100-cycles.yml'
  pull_request:
    paths:
      - 'tools/run_acceptance_100_iterations.py'
      - 'tests/test_acceptance_100_runner.py'
      - 'tests/test_acceptance_evidence_integrity.py'
      - 'tools/verify_acceptance_evidence.py'
      - '.github/workflows/acceptance-100-cycles.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aepx-100-cycle-${{ github.ref }}
  cancel-in-progress: false
jobs:
  acceptance-100-cycles:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preflight runner and test syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/run_acceptance_100_iterations.py tools/verify_acceptance_evidence.py tests/test_acceptance_evidence_integrity.py tests/test_acceptance_100_runner.py
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover("tests", pattern="test_acceptance_100_runner.py")
          count = suite.countTestCases()
          print(f"Runner self-tests discovered: {count}")
          if count < 13:
              raise SystemExit("Runner self-test coverage below required minimum of 13")
          PY
          python -m unittest discover -s tests -p 'test_acceptance_100_runner.py' -v
      - name: Run up to 100 sequential acceptance cycles (stop on failure)
        shell: bash
        run: |
          set -euo pipefail
          python tools/run_acceptance_100_iterations.py --iterations 100 --output acceptance-100-iterations.json
      - name: Validate report provenance and completion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path("acceptance-100-iterations.json").read_text())
          assert report["source_commit"] == os.environ["GITHUB_SHA"], "commit mismatch"
          assert report["workflow_run_id"] == os.environ["GITHUB_RUN_ID"], "run mismatch"
          assert report["requested"] == report["executed"] == 100, "incomplete cycles"
          assert report["all_passed"] is True, "failed cycles"
          assert len(report["runs"]) == 100, "missing run records"
          assert all(
              isinstance(run, dict)
              and run.get("iteration") == i
              and run.get("passed") is True
              and type(run.get("tests_executed")) is int
              and run["tests_executed"] >= 42
              and run.get("return_code") == 0
              for i, run in enumerate(report["runs"], 1)
          ), "invalid, duplicate, or out-of-order cycle"
          assert report["independent_acceptance_established"] is False, "invalid acceptance claim"
          assert report["production_deployment_authorized"] is False, "invalid deployment claim"
          print("Offline 100-cycle report integrity checks passed; independent acceptance remains blocked.")
          PY
      - name: Publish scoped result
        if: always()
        shell: bash
        run: |
          if [[ -f acceptance-100-iterations.json ]]; then
            python - <<'PY'
          import json, os
          data = json.load(open('acceptance-100-iterations.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Offline acceptance repetition\n')
              out.write(f"- Cycles executed: {data['executed']} / {data['requested']}\n")
              out.write(f"- All passed: {data['all_passed']}\n")
              out.write(f"- Source commit: {data.get('source_commit') or 'unavailable'}\n")
              out.write(f"- Workflow run ID: {data.get('workflow_run_id') or 'unavailable'}\n")
              out.write('- Independent acceptance: NOT ESTABLISHED\n')
              out.write('- Merge or deployment authorized: NO\n')
          PY
          else
            echo 'No completion report generated; treat execution as unverified' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aepx-100-cycle-offline-report
          retention-days: 7
          if-no-files-found: warn
          path: acceptance-100-iterations.json
