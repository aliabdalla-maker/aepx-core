name: HITL PostgreSQL receipt replay regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_hitl_receipt_replay_postgres.py tests/test_hitl_signed_receipt_postgres.py tests/test_hitl_signed_receipts.py tests/test_hitl_provider_evidence.py
