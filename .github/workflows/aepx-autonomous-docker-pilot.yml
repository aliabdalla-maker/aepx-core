name: AEP-X Docker sandbox policy
on:
  pull_request:
    paths:
      - 'scripts/aepx_autonomous_docker_pilot.py'
      - 'tests/test_aepx_autonomous_docker_pilot.py'
      - '.github/workflows/aepx-autonomous-docker-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Issue #370: bound queue fan-out. One running + one pending run per
  # workflow/event/ref; superseded branch and PR runs are cancelled.
  # master never cancels an in-progress run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  offline-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Docker command policy without launching Docker
        run: python -m unittest discover -s tests -p 'test_aepx_autonomous_docker_pilot.py' -v
