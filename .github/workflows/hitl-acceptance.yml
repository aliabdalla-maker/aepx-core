name: HITL P0 acceptance
on:
  push:
    paths:
      - 'services/governance/**'
      - 'db/migrations/20261113_hitl*'
      - 'tests/test_hitl*'
      - '.github/workflows/hitl-acceptance.yml'
  pull_request:
    paths:
      - 'services/governance/**'
      - 'db/migrations/20261113_hitl*'
      - 'tests/test_hitl*'
      - '.github/workflows/hitl-acceptance.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r services/governance/requirements.txt pytest httpx
      - name: Run HITL offline suite
        env:
          PYTHONPATH: services/governance
        run: python -m pytest tests/test_hitl_*.py -q -k 'not PostgresIntegration'
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: hitl_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hitl_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGPASSWORD: integration-only
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: hitl_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r services/governance/requirements.txt pytest
      - name: Apply isolated HITL schema and migrations
        run: |
          psql -v ON_ERROR_STOP=1 -f db/migrations/20261113_hitl_staging.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/20261113_hitl_outbox_lease.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/20261113_hitl_tenant_fk.sql
      - name: Provision restricted non-owner test role
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE hitl_ci_app LOGIN PASSWORD 'disposable-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          GRANT CONNECT ON DATABASE hitl_ci TO hitl_ci_app;
          GRANT USAGE ON SCHEMA hitl TO hitl_ci_app;
          GRANT SELECT,INSERT,UPDATE ON ALL TABLES IN SCHEMA hitl TO hitl_ci_app;
          GRANT USAGE,SELECT ON ALL SEQUENCES IN SCHEMA hitl TO hitl_ci_app;
          SQL
      - name: Execute real PostgreSQL tenant and concurrency tests
        env:
          PYTHONPATH: services/governance
          HITL_TEST_DISPOSABLE: 'yes'
          HITL_TEST_DATABASE_URL: postgresql://hitl_ci_app:disposable-only@localhost:5432/hitl_ci
        run: python -m pytest tests/test_hitl_postgres_integration.py -v
