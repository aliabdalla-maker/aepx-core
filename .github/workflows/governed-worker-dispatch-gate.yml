name: Governed worker pre-dispatch fail closed
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  worker-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platform/saas-ide/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_governed_worker_dispatch_gate.py tests/test_phase24.py
