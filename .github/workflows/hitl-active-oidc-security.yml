name: HITL active identity regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  # Issue #370: bound queue fan-out. One running + one pending run per
  # workflow/event/ref; superseded branch and PR runs are cancelled.
  # master never cancels an in-progress run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  oidc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r services/governance/requirements.txt pytest
      - name: Verify active API OIDC security
        env:
          PYTHONPATH: services/governance
        run: python -m pytest -q tests/test_hitl_active_oidc_security.py tests/test_hitl_operator_identity.py
