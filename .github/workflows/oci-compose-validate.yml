name: OCI Docker deployment validation
on:
  pull_request:
    paths:
      - 'deploy/oci/**'
      - 'docker-compose.yml'
      - '.github/workflows/oci-compose-validate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          for script in deploy/oci/*.sh; do bash -n "$script"; done
          python3 -m py_compile deploy/oci/*.py
      - name: Validate OCI Compose overlay
        run: |
          trap 'rm -f .env' EXIT
          printf 'AEPX_POSTGRES_PASSWORD=CITestOnly_1234567890_abcdefghi\nAEPX_NEO4J_PASSWORD=CITestOnly_0987654321_abcdefghi\n' > .env
          chmod 600 .env
          bash deploy/oci/deploy.sh --validate-only
          python3 - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path
          text = Path('deploy/oci/compose.secure.generated.yml').read_text()
          section = text.split('\nvolumes:\n')[0]
          names = re.findall(r'^  ([a-zA-Z0-9_-]+):$', section, re.M)
          assert len(names) == len(set(names)), 'Duplicate service entries'
          cmd = ['docker','compose','-f','docker-compose.yml','-f','deploy/oci/compose.secure.generated.yml','config','--format','json']
          config = json.loads(subprocess.check_output(cmd, text=True))
          for name, service in config['services'].items():
              for port in service.get('ports', []):
                  assert port.get('host_ip') == '127.0.0.1', (name, port)
          print('PASS: unique services and loopback-only ports')
          PY
