name: OCI Docker deployment validation
on:
  pull_request:
    paths:
      - 'deploy/oci/**'
      - 'docker-compose.yml'
      - 'services/identity/**'
      - 'services/registry/**'
      - 'services/trust/**'
      - '.github/workflows/oci-compose-validate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          for script in deploy/oci/*.sh; do bash -n "$script"; done
          python3 -m py_compile deploy/oci/*.py
      - name: Validate OCI Compose overlay
        run: |
          trap 'rm -f .env' EXIT
          python3 - <<'PY'
          import secrets
          from pathlib import Path
          Path('.env').write_text(
              'AEPX_POSTGRES_PASSWORD=' + secrets.token_urlsafe(32) + '\n'
              + 'AEPX_NEO4J_PASSWORD=' + secrets.token_urlsafe(32) + '\n'
              + 'AEPX_IDENTITY_JWT_SECRET=' + secrets.token_urlsafe(32) + '\n'
              + 'AEPX_INTERNAL_SERVICE_KEY=' + secrets.token_urlsafe(32) + '\n'
          )
          PY
          chmod 600 .env
          bash deploy/oci/deploy.sh --validate-only
          python3 - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path
          text = Path('deploy/oci/compose.secure.generated.yml').read_text()
          section = text.split('\nvolumes:\n')[0]
          names = re.findall(r'^  ([a-zA-Z0-9_-]+):$', section, re.M)
          assert len(names) == len(set(names)), 'Duplicate service entries'
          cmd = ['docker','compose','-f','docker-compose.yml','-f','deploy/oci/compose.secure.generated.yml','config','--format','json']
          config = json.loads(subprocess.check_output(cmd, text=True))
          for name, service in config['services'].items():
              for port in service.get('ports', []):
                  assert port.get('host_ip') == '127.0.0.1', (name, port)
          print('PASS: unique services and loopback-only ports')
          PY
      - name: Validate isolated OCI staging stack
        run: |
          trap 'rm -f .env' EXIT
          python3 - <<'PY'
          import secrets
          from pathlib import Path
          Path('.env').write_text(
              'AEPX_POSTGRES_PASSWORD=' + secrets.token_urlsafe(32) + '\n'
              + 'AEPX_NEO4J_PASSWORD=' + secrets.token_urlsafe(32) + '\n'
              + 'AEPX_IDENTITY_JWT_SECRET=' + secrets.token_urlsafe(32) + '\n'
              + 'AEPX_INTERNAL_SERVICE_KEY=' + secrets.token_urlsafe(32) + '\n'
          )
          PY
          chmod 600 .env
          python3 -m pip install -q pyyaml
          bash deploy/oci/staging.sh --validate
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          import yaml
          cfg = yaml.safe_load(Path("deploy/oci/compose.staging.yml").read_text())
          for service, spec in cfg["services"].items():
              assert spec.get("mem_limit"), f"{service} missing memory limit"
              assert spec.get("pids_limit"), f"{service} missing PID limit"
              assert "no-new-privileges:true" in spec.get("security_opt", []), f"{service} missing privilege escalation protection"
          print("PASS: staging resource limits")
          PY
          if AEPX_STAGING_APPROVED=yes bash deploy/oci/staging.sh --start; then
            echo "ERROR: staging started without backup and image approval" >&2
            exit 1
          fi
          echo "PASS: unapproved staging startup rejected"
      - name: Verify staging deployment cannot start without operator approval
        run: |
          trap 'rm -f .env' EXIT
          python3 - <<'PY'
          import secrets
          from pathlib import Path
          Path('.env').write_text(
              'AEPX_POSTGRES_PASSWORD=' + secrets.token_urlsafe(32) + '\n'
              + 'AEPX_NEO4J_PASSWORD=' + secrets.token_urlsafe(32) + '\n'
              + 'AEPX_IDENTITY_JWT_SECRET=' + secrets.token_urlsafe(32) + '\n'
              + 'AEPX_INTERNAL_SERVICE_KEY=' + secrets.token_urlsafe(32) + '\n'
          )
          PY
          chmod 600 .env
          if bash deploy/oci/staging.sh --start; then
            echo "FAIL: unapproved staging deployment was permitted" >&2
            exit 1
          fi
          echo "PASS: staging requires explicit operator approval"
      - name: Build isolated staging application images
        run: |
          trap 'rm -f .env' EXIT
          python3 - <<'PY'
          import secrets
          from pathlib import Path
          Path('.env').write_text(
              'AEPX_POSTGRES_PASSWORD=' + secrets.token_urlsafe(32) + '\n'
              + 'AEPX_NEO4J_PASSWORD=' + secrets.token_urlsafe(32) + '\n'
              + 'AEPX_IDENTITY_JWT_SECRET=' + secrets.token_urlsafe(32) + '\n'
              + 'AEPX_INTERNAL_SERVICE_KEY=' + secrets.token_urlsafe(32) + '\n'
          )
          PY
          chmod 600 .env
          docker compose --env-file .env -p aepx-oci-staging -f deploy/oci/compose.staging.yml build identity trust registry
      - name: Exercise isolated PostgreSQL restore rehearsal
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          printf 'CREATE TABLE restore_probe (id integer PRIMARY KEY);\nINSERT INTO restore_probe VALUES (1);\n' | gzip -c > "$tmpdir/fixture.sql.gz"
          (cd "$tmpdir" && sha256sum fixture.sql.gz > fixture.sql.gz.sha256)
          bash deploy/oci/restore-staging-rehearsal.sh "$tmpdir/fixture.sql.gz"
          printf 'corruption' >> "$tmpdir/fixture.sql.gz"
          if bash deploy/oci/restore-staging-rehearsal.sh "$tmpdir/fixture.sql.gz"; then
            echo "FAIL: corrupted backup was accepted" >&2
            exit 1
          fi
          echo "PASS: isolated restore and checksum rejection"
      - name: Verify secure staging identity and persistence configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          identity=Path("services/identity/app/main.py").read_text()
          registry=Path("services/registry/app/main.py").read_text()
          trust=Path("services/trust/app/main.py").read_text()
          compose=Path("deploy/oci/compose.staging.yml").read_text()
          assert 'AEPX_SECURE_MODE' in identity
          assert 'Service authentication required' in identity
          assert 'hmac.compare_digest' in identity
          assert 'AEPX_REQUIRE_DATABASE' in registry and 'AEPX_REQUIRE_DATABASE' in trust
          assert compose.count('AEPX_REQUIRE_DATABASE: "true"') == 2
          assert 'AEPX_IDENTITY_JWT_SECRET:?' in compose
          print("PASS: secure staging configuration assertions")
          PY
      - name: Exercise secure Identity HTTP authentication
        run: |
          set -euo pipefail
          python3 -m pip install -q fastapi==0.111.0 httpx==0.27.0 pyjwt==2.8.0 cryptography==42.0.5 base58==2.1.1
          PYTHONPATH=services/identity AEPX_SECURE_MODE=true IDENTITY_JWT_SECRET=0123456789abcdefghijklmnopqrstuvwxyz AEPX_INTERNAL_SERVICE_KEY=abcdefghijklmnopqrstuvwxyz0123456789 python3 - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          client=TestClient(app)
          assert client.get("/health").status_code == 200
          token="/token?subject=test-agent"
          assert client.post(token).status_code == 403
          assert client.post(token, headers={"X-AEPX-Service-Key":"abcdefghijklmnopqrstuvwxyz0123456789"}).status_code == 403
          assert client.post("/did").status_code == 403
          assert client.post("/did", headers={"X-AEPX-Service-Key":"invalid"}).status_code == 403
          response=client.post("/did", headers={"X-AEPX-Service-Key":"abcdefghijklmnopqrstuvwxyz0123456789"})
          assert response.status_code == 200, response.text
          assert response.json().get("did", "").startswith("did:key:"), response.text
          print("PASS: secure identity rejects unauthorized calls and permits internal service calls")
          PY
