name: MCP offline contract gate
on:
  pull_request:
    paths:
      - 'platform/saas-ide/backend/app/mcp_contract_gate.py'
      - 'platform/saas-ide/backend/app/mcp_dispatch_binding.py'
      - 'platform/saas-ide/backend/app/mcp_discovery_policy.py'
      - 'platform/saas-ide/backend/app/mcp_protocol_envelope.py'
      - 'platform/saas-ide/backend/app/mcp_response_gate.py'
      - 'platform/saas-ide/backend/app/mcp_sse_gate.py'
      - 'platform/saas-ide/backend/app/mcp_preflight.py'
      - 'platform/saas-ide/backend/app/mcp_db_preflight.py'
      - 'platform/saas-ide/backend/app/mcp_atomic_claim.py'
      - 'tests/test_mcp_contract_gate.py'
      - 'tests/test_mcp_dispatch_binding.py'
      - 'tests/test_mcp_discovery_policy.py'
      - 'tests/test_mcp_protocol_envelope.py'
      - 'tests/test_mcp_response_gate.py'
      - 'tests/test_mcp_sse_gate.py'
      - 'tests/test_mcp_preflight.py'
      - 'tests/test_mcp_db_preflight.py'
      - 'tests/test_mcp_atomic_claim.py'
      - '.github/workflows/mcp-offline-contract.yml'
  push:
    branches: [master]
    paths:
      - 'platform/saas-ide/backend/app/mcp_contract_gate.py'
      - 'platform/saas-ide/backend/app/mcp_dispatch_binding.py'
      - 'platform/saas-ide/backend/app/mcp_discovery_policy.py'
      - 'platform/saas-ide/backend/app/mcp_protocol_envelope.py'
      - 'platform/saas-ide/backend/app/mcp_response_gate.py'
      - 'platform/saas-ide/backend/app/mcp_sse_gate.py'
      - 'tests/test_mcp_contract_gate.py'
      - 'tests/test_mcp_dispatch_binding.py'
      - 'tests/test_mcp_discovery_policy.py'
      - 'tests/test_mcp_protocol_envelope.py'
      - 'tests/test_mcp_response_gate.py'
      - 'tests/test_mcp_sse_gate.py'
      - '.github/workflows/mcp-offline-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SQLAlchemy for DB preflight tests
        run: python -m pip install 'SQLAlchemy>=2.0,<3.0'
      - name: Compile and test offline MCP gate
        run: |
          python -m py_compile platform/saas-ide/backend/app/mcp_contract_gate.py platform/saas-ide/backend/app/mcp_dispatch_binding.py platform/saas-ide/backend/app/mcp_discovery_policy.py platform/saas-ide/backend/app/mcp_protocol_envelope.py platform/saas-ide/backend/app/mcp_response_gate.py platform/saas-ide/backend/app/mcp_sse_gate.py platform/saas-ide/backend/app/mcp_preflight.py platform/saas-ide/backend/app/mcp_db_preflight.py platform/saas-ide/backend/app/mcp_atomic_claim.py
          python -m unittest discover -s tests -p 'test_mcp_contract_gate.py' -v
          python -m unittest discover -s tests -p 'test_mcp_dispatch_binding.py' -v
          python -m unittest discover -s tests -p 'test_mcp_discovery_policy.py' -v
          python -m unittest discover -s tests -p 'test_mcp_protocol_envelope.py' -v
          python -m unittest discover -s tests -p 'test_mcp_response_gate.py' -v
          python -m unittest discover -s tests -p 'test_mcp_sse_gate.py' -v
          python -m unittest discover -s tests -p 'test_mcp_preflight.py' -v
          python -m unittest discover -s tests -p 'test_mcp_db_preflight.py' -v
          python -m unittest discover -s tests -p 'test_mcp_atomic_claim.py' -v
