name: AEP-X offline API usage ledger
on:
  pull_request:
    paths:
      - 'scripts/aepx_autonomous_usage_ledger.py'
      - 'tests/test_aepx_autonomous_usage_ledger.py'
      - '.github/workflows/aepx-autonomous-usage-ledger.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate offline usage ledger
        run: python -m unittest discover -s tests -p 'test_aepx_autonomous_usage_ledger.py' -v
