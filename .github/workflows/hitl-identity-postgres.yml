name: HITL authoritative identity DB security
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_hitl_identity_postgres.py tests/test_hitl_identity_policy.py
