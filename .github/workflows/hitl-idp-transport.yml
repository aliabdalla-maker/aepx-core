name: HITL trusted IdP transport boundary
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  transport-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_hitl_idp_transport.py -v
