# Agentic Antivirus CI/CD (CI-01..15, DLV-07/08/10/11). Builds and tests on every push/PR touching the
# product. Signing happens only when the repository secrets exist; otherwise artifacts are unsigned and
# the job summary says so. Production deployment is manual, from a verified commit, behind the protected
# "agentic-antivirus-production" environment (configure required reviewers in repository settings).
name: agentic-antivirus
on:
  push:
    paths: ["products/agentic-antivirus/**", "services/governance/**", ".github/workflows/agentic-antivirus.yml"]
  pull_request:
    paths: ["products/agentic-antivirus/**", "services/governance/**", ".github/workflows/agentic-antivirus.yml"]
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: "Verified commit SHA to deploy (production only; requires environment approval)"
        required: false
      channel:
        description: "Desktop update channel"
        default: beta
        type: choice
        options: [beta, stable]
permissions:
  contents: read
concurrency:
  # Issue #370: bound queue fan-out. One running + one pending run per
  # workflow/event/ref; superseded branch and PR runs are cancelled.
  # master never cancels an in-progress run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
env:
  P: products/agentic-antivirus

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci, POSTGRES_USER: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -r $P/control-plane/requirements.txt -r $P/agent/requirements.txt pytest ruff==0.16.0
      - name: AEP-X governance in its own environment (its FastAPI pin differs from the control plane's)
        run: python -m venv /tmp/gov && /tmp/gov/bin/pip install -q -r services/governance/requirements.txt
      - run: ruff check --config ruff.toml $P/control-plane $P/agent $P/detection
      - name: Integration tests (real PostgreSQL RLS + real AEP-X governance service)
        env: { AAV_TEST_PG_ADMIN_DSN: "postgresql://postgres:ci@127.0.0.1:5432/postgres", AAV_GOVERNANCE_PYTHON: /tmp/gov/bin/python }
        run: cd $P/control-plane && python -m pytest tests -v --junitxml=../../../aav-backend-junit.xml
      - name: Evidence record
        if: always()
        run: |
          python - <<'EOF'
          import json, os, xml.etree.ElementTree as ET, datetime
          if not os.path.exists("aav-backend-junit.xml"): raise SystemExit("no test report: tests did not run")
          r = ET.parse("aav-backend-junit.xml").getroot()
          s = r if r.tag == "testsuite" else r.find("testsuite")
          rec = {"test_id": "aav-backend", "timestamp_utc": datetime.datetime.utcnow().isoformat() + "Z",
                 "commit_sha": os.environ["GITHUB_SHA"], "environment": "ci", "tests": int(s.get("tests")),
                 "failures": int(s.get("failures")) + int(s.get("errors")), "result": "passed" if int(s.get("failures")) + int(s.get("errors")) == 0 else "failed",
                 "trace_or_artifact_link": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}
          open("aav-evidence-backend.json", "w").write(json.dumps(rec, indent=1)); print(rec)
          EOF
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: aav-backend-evidence, path: "aav-*.xml\naav-evidence-*.json" }

  console:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: "${{ env.P }}/web/package-lock.json" }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: cd $P/web && npm ci && npx tsc --noEmit && npx vitest run && npx next build
      - run: pip install -r $P/control-plane/requirements.txt -r $P/agent/requirements.txt playwright starlette && python -m playwright install --with-deps chromium
      - run: python -m venv /tmp/gov && /tmp/gov/bin/pip install -q -r services/governance/requirements.txt
      - name: Accessibility gate (axe-core, WCAG 2.2 A/AA, light/dark/high-contrast/RTL)
        env: { PGPASSWORD: ci }
        run: |
          psql -h 127.0.0.1 -U postgres -c "create database aav"
          for f in $P/control-plane/migrations/*.sql; do psql -h 127.0.0.1 -U postgres -d aav -v ON_ERROR_STOP=1 -f $f; done
          psql -h 127.0.0.1 -U postgres -d aav -c "alter role aav_app password 'ci'"
          python -c "from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey as K;from cryptography.hazmat.primitives import serialization as s;open('/tmp/k.pem','wb').write(K.generate().private_bytes(s.Encoding.PEM,s.PrivateFormat.PKCS8,s.NoEncryption()))"
          (cd services/governance && DATABASE_URL=postgresql://x@127.0.0.1:1/x /tmp/gov/bin/python -m uvicorn app.main:app --port 8091 &)
          (cd $P/control-plane && AAV_DATABASE_URL=postgresql://aav_app:ci@127.0.0.1/aav AAV_SIGNING_KEY_FILE=/tmp/k.pem AAV_GOVERNANCE_URL=http://127.0.0.1:8091 AAV_FILE_STORE_DIR=/tmp/f PYTHONPATH=../detection python -m uvicorn app.main:app --port 8000 &)
          (cd $P && AAV_CONSOLE_OUT=web/out AAV_API=http://127.0.0.1:8000 python -m uvicorn --app-dir tools serve_console:app --port 8080 &)
          sleep 8
          SEED=$(cd $P && AAV_API=http://127.0.0.1:8000 AAV_PSQL=postgresql://postgres:ci@127.0.0.1/aav python tools/seed_demo.py)
          python $P/web/scripts/a11y_check.py http://127.0.0.1:8080 $P/web/node_modules/axe-core/axe.min.js \
            $(echo "$SEED" | python -c "import sys,json;d=json.load(sys.stdin);print(d['token'],d['tenant'])") | tee aav-a11y.json
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: aav-console, path: "aav-a11y.json\n${{ env.P }}/web/out" }

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install pip-audit && pip-audit -r $P/control-plane/requirements.txt -r $P/agent/requirements.txt
      - run: cd $P/web && npm ci && npm audit --audit-level=high --omit=dev
      - name: Compose guard (loopback-only, no privileged, Always Free totals)
        run: python $P/deploy/guard.py
      - uses: anchore/sbom-action@v0
        with: { path: "${{ env.P }}", format: spdx-json, artifact-name: aav-sbom.spdx.json }

  agent:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: windows-latest, target: windows-x64 }
          - { os: macos-latest, target: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -r ${{ env.P }}/agent/requirements.txt pyinstaller pytest
      - if: runner.os == 'Windows'
        run: pip install pywin32
      - name: Agent unit tests on this OS
        run: python -m pytest ${{ env.P }}/agent/tests -v
      - run: python ${{ env.P }}/agent/packaging/build.py dist
      - name: Smoke test the binary
        shell: bash
        run: |
          BIN=$(ls dist/aav-agent-* | grep -v -e service -e SHA256SUMS | head -1); echo "smoke: $BIN"
          "./$BIN" --state "$RUNNER_TEMP/s" status || test $? -eq 2
      - uses: actions/upload-artifact@v7
        with: { name: "aav-agent-${{ matrix.target }}", path: "dist/aav-agent-*\ndist/SHA256SUMS-*" }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v6
        with: { gradle-version: "8.11.1" }
      - name: Decode upload key if configured
        env: { KS: "${{ secrets.AEPX_UPLOAD_KEYSTORE_B64 }}" }
        run: if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"; echo "AEPX_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"; fi
      - name: Unit tests and release bundle
        env:
          AEPX_UPLOAD_STORE_PASSWORD: ${{ secrets.AEPX_UPLOAD_STORE_PASSWORD }}
          AEPX_UPLOAD_KEY_ALIAS: ${{ secrets.AEPX_UPLOAD_KEY_ALIAS }}
          AEPX_UPLOAD_KEY_PASSWORD: ${{ secrets.AEPX_UPLOAD_KEY_PASSWORD }}
        run: cd $P/clients/android && gradle :app:testDebugUnitTest :app:bundleRelease
      - name: Verify package, AdMob IDs and signing state
        run: |
          AAB=$(ls $P/clients/android/app/build/outputs/bundle/release/*.aab)
          unzip -p "$AAB" base/manifest/AndroidManifest.xml | strings | grep -q com.equalitysoftware.agenticantivirus
          if jarsigner -verify "$AAB" >/dev/null 2>&1; then
            keytool -printcert -jarfile "$AAB" | grep SHA256 | tee -a "$GITHUB_STEP_SUMMARY"
            echo "Compare this upload-key fingerprint with Play Console > App integrity before uploading." >> "$GITHUB_STEP_SUMMARY"
          else echo "AAB is UNSIGNED (upload key secrets not configured)." >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v7
        with: { name: aav-android-aab, path: "${{ env.P }}/clients/android/app/build/outputs/bundle/release/*.aab" }

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      - name: Build for simulator (no signing; App Store archive needs Apple credentials)
        run: |
          cd $P/clients/ios && xcodegen generate
          xcodebuild -project AgenticAntivirus.xcodeproj -scheme AgenticAntivirus -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO AAV_ADMOB_APP_ID=ca-app-pub-3940256099942544~1458002511 build
          echo "iOS: simulator build only. Signed archive and App Store submission need AEPX_APPLE_* secrets and approval." >> "$GITHUB_STEP_SUMMARY"

  desktop:
    strategy:
      fail-fast: false
      matrix: { os: [windows-latest, macos-latest, ubuntu-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - name: Test and package
        shell: bash
        env:
          AAV_CHANNEL: ${{ inputs.channel || 'beta' }}
          CSC_LINK: ${{ runner.os == 'Windows' && secrets.AEPX_WIN_CSC_LINK || secrets.AEPX_MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.AEPX_WIN_CSC_KEY_PASSWORD || secrets.AEPX_MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.AEPX_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.AEPX_APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.AEPX_APPLE_TEAM_ID }}
        run: |
          cd $P/clients/desktop && npm ci && npm test
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD; export CSC_IDENTITY_AUTO_DISCOVERY=false; echo "Desktop ${{ matrix.os }}: UNSIGNED" >> "$GITHUB_STEP_SUMMARY"; fi
          npx electron-builder --publish never
          cd dist && for f in agentic-antivirus-*; do [ -f "$f" ] && (sha256sum "$f" 2>/dev/null || shasum -a 256 "$f"); done > SHA256SUMS-${{ matrix.os }}.txt
      - uses: actions/upload-artifact@v7
        with: { name: "aav-desktop-${{ matrix.os }}", path: "${{ env.P }}/clients/desktop/dist/agentic-antivirus-*\n${{ env.P }}/clients/desktop/dist/SHA256SUMS-*" }

  images:
    needs: [backend, console, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # publish to GitHub Container Registry on pushes (never on pull requests)
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build multi-arch images (amd64 + arm64 for OCI A1)
        run: |
          for c in control-plane web; do
            docker buildx build --platform linux/amd64,linux/arm64 -f $P/$c/Dockerfile -t aav-$c:${GITHUB_SHA} $P \
              --provenance=true --sbom=true --output type=oci,dest=/tmp/aav-$c.oci.tar
            sha256sum /tmp/aav-$c.oci.tar | tee -a $GITHUB_STEP_SUMMARY
          done
      - uses: actions/upload-artifact@v7
        with: { name: aav-images, path: /tmp/aav-*.oci.tar, retention-days: 14 }
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feat/agentic-antivirus' || startsWith(github.ref, 'refs/tags/aav-v'))
        uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Publish images (docker pull ghcr.io/<owner>/agentic-antivirus-<component>)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feat/agentic-antivirus' || startsWith(github.ref, 'refs/tags/aav-v'))
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          case "$GITHUB_REF" in refs/heads/master) TAG=latest;; refs/tags/*) TAG=${GITHUB_REF_NAME#aav-v};; *) TAG=edge;; esac
          for c in control-plane web; do
            IMG=ghcr.io/$OWNER/agentic-antivirus-$c
            docker buildx build --platform linux/amd64,linux/arm64 -f $P/$c/Dockerfile $P --provenance=true --sbom=true \
              --label org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY} \
              --label org.opencontainers.image.description="Agentic Antivirus $c" \
              -t $IMG:${GITHUB_SHA} -t $IMG:$TAG --push
            echo "published \`$IMG:${GITHUB_SHA}\` and \`$IMG:$TAG\`" >> $GITHUB_STEP_SUMMARY
          done

  release:
    # GitHub Release for a tag aav-v<version>. Pre-release until the agents are code-signed: the notes say plainly
    # whether each binary is signed, and SHA256SUMS lets users verify downloads.
    if: startsWith(github.ref, 'refs/tags/aav-v')
    needs: [agent, desktop, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with: { path: rel, pattern: "aav-{agent,desktop}-*", merge-multiple: true }
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNED: ${{ secrets.AEPX_WIN_CSC_LINK != '' }}
        run: |
          cd rel && cat SHA256SUMS-* > SHA256SUMS.txt 2>/dev/null || true
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          {
            echo "Agentic Antivirus ${GITHUB_REF_NAME#aav-} (early access)."
            echo
            if [ "$SIGNED" = true ]; then echo "The Windows desktop app is code-signed. **The agent binaries are not code-signed yet.**"; else echo "**None of these binaries are code-signed yet.**"; fi; echo "Verify every download against SHA256SUMS.txt before installing."
            echo
            echo "Server: \`docker pull ghcr.io/$OWNER/agentic-antivirus-control-plane:${GITHUB_SHA}\` and \`ghcr.io/$OWNER/agentic-antivirus-web:${GITHUB_SHA}\`."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease --title "Agentic Antivirus ${GITHUB_REF_NAME#aav-}" \
            --notes-file notes.md $(ls | grep -v '^notes.md$')

  deploy-production:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_sha != ''
    needs: [images, agent, android, desktop]
    runs-on: ubuntu-latest
    environment: agentic-antivirus-production
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ inputs.deploy_sha }}" }
      - name: Refuse unverified commits
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.deploy_sha }}"
          git merge-base --is-ancestor HEAD origin/master || { echo "deploy_sha is not on master" >&2; exit 1; }
      - name: Deploy over SSH (fails closed without the host secrets)
        env:
          HOST: ${{ secrets.AAV_OCI_HOST }}
          KEY: ${{ secrets.AAV_OCI_SSH_KEY }}
        run: |
          test -n "$HOST" && test -n "$KEY" || { echo "AAV_OCI_HOST / AAV_OCI_SSH_KEY not configured; nothing deployed" >&2; exit 1; }
          echo "$KEY" > k && chmod 600 k
          ssh -i k -o StrictHostKeyChecking=yes "$HOST" "cd /opt/aepx-core && git fetch && git checkout ${{ inputs.deploy_sha }} && products/agentic-antivirus/deploy/deploy.sh ${{ inputs.deploy_sha }}"
