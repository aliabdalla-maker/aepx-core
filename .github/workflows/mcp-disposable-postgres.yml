name: MCP disposable PostgreSQL acceptance
on:
  pull_request:
    paths:
      - 'platform/saas-ide/backend/app/mcp_remote_intent_*.py'
      - 'tests/test_mcp_remote_intent_*.py'
      - 'platform/saas-ide/backend/app/mcp_remote_tenant_context.py'
      - 'platform/saas-ide/backend/app/mcp_remote_intent_transition.py'
      - 'platform/saas-ide/backend/app/mcp_remote_intent_state.py'
      - 'platform/saas-ide/backend/app/mcp_remote_dispatch_*.py'
      - 'tests/test_mcp_remote_dispatch_*.py'
      - 'platform/saas-ide/backend/app/mcp_http_preflight.py'
      - 'tests/test_mcp_http_preflight.py'
      - 'platform/saas-ide/backend/app/mcp_http_response_guard.py'
      - 'tests/test_mcp_http_response*.py'
      - 'tests/check_mcp_pg_ci.py'
      - 'tests/test_mcp_pg_ci_guard.py'
      - '.github/workflows/mcp-disposable-postgres.yml'
  push:
    branches: [master]
    paths:
      - 'platform/saas-ide/backend/app/mcp_remote_intent_*.py'
      - 'tests/test_mcp_remote_intent_*.py'
      - 'platform/saas-ide/backend/app/mcp_remote_tenant_context.py'
      - 'platform/saas-ide/backend/app/mcp_remote_intent_transition.py'
      - 'platform/saas-ide/backend/app/mcp_remote_intent_state.py'
      - 'platform/saas-ide/backend/app/mcp_remote_dispatch_*.py'
      - 'tests/test_mcp_remote_dispatch_*.py'
      - 'platform/saas-ide/backend/app/mcp_http_preflight.py'
      - 'tests/test_mcp_http_preflight.py'
      - 'platform/saas-ide/backend/app/mcp_http_response_guard.py'
      - 'tests/test_mcp_http_response*.py'
      - 'tests/check_mcp_pg_ci.py'
      - 'tests/test_mcp_pg_ci_guard.py'
      - '.github/workflows/mcp-disposable-postgres.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: disposable-only
          POSTGRES_DB: aepx_mcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aepx_mcp_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AEPX_ALLOW_DISPOSABLE_PG_TESTS: 'yes'
      AEPX_TEST_PG_DSN: 'postgresql://postgres:disposable-only@127.0.0.1:5432/aepx_mcp_test'
      AEPX_TEST_PG_RUNTIME_DSN: 'postgresql://aepx_runtime:disposable-runtime@127.0.0.1:5432/aepx_mcp_test'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated database test driver
        run: python -m pip install 'psycopg[binary]>=3.1,<4'
      - name: Verify fail-closed DSN guard offline
        run: python -m unittest discover -s tests -p 'test_mcp_pg_ci_guard.py' -v
      - name: Verify offline dispatch safety contracts
        run: python -m unittest discover -s tests -p 'test_mcp_remote_dispatch_*.py' -v
      - name: Verify offline HTTPS preflight security
        run: python -m unittest discover -s tests -p 'test_mcp_http_preflight.py' -v
      - name: Verify offline MCP response policy and byte limits
        run: python -m unittest discover -s tests -p 'test_mcp_http_response*.py' -v
      - name: Create least-privilege runtime role
        env:
          PGPASSWORD: disposable-only
        run: |
          psql -h 127.0.0.1 -U postgres -d aepx_mcp_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE aepx_runtime LOGIN PASSWORD 'disposable-runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          SQL
      - name: Run real disposable PostgreSQL reservation tests
        run: |
          python -m compileall -q platform/saas-ide/backend/app
          python tests/check_mcp_pg_ci.py
