name: Deploy AEP-X GUI to OCI

on:
  push:
    branches: [master]
    paths:
      - 'platform/ecosystem-tracker/**'
      - 'deploy/oci/**'
      - '.github/workflows/deploy-oci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aepx-oci-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]
    environment: production
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate OCI runner and static app
        run: |
          set -euo pipefail
          echo "runner=$(hostname) user=$(id -un) arch=$(uname -m)"
          test -f platform/ecosystem-tracker/index.html
          test -f platform/ecosystem-tracker/data/portals.json
          command -v rsync >/dev/null
          command -v curl >/dev/null

      - name: Publish versioned release on OCI
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ROOT=/srv/aepx
          RELEASES="$ROOT/releases"
          RELEASE="$RELEASES/$RELEASE_SHA"
          CURRENT="$ROOT/current"

          sudo mkdir -p "$RELEASES"
          sudo rm -rf "$RELEASE"
          sudo mkdir -p "$RELEASE"
          sudo rsync -a --delete platform/ecosystem-tracker/ "$RELEASE/"
          sudo chmod -R a+rX "$RELEASE"
          sudo ln -sfn "releases/$RELEASE_SHA" "$ROOT/current.next"
          sudo mv -Tf "$ROOT/current.next" "$CURRENT"

          # Keep only the five newest releases. Caddy serves /srv/aepx/current
          # through a read-only bind mount owned by the existing Good Hour stack.
          mapfile -t old < <(sudo find "$RELEASES" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -nr | awk 'NR>5 {$1=""; sub(/^ /,""); print}')
          if ((${#old[@]})); then
            sudo rm -rf -- "${old[@]}"
          fi

      - name: Verify release on disk
        run: |
          set -euo pipefail
          test -f /srv/aepx/current/index.html
          test -f /srv/aepx/current/data/portals.json

      - name: Verify production URLs
        run: |
          set -euo pipefail
          for url in \
            https://softwareequality.com/aep-x/ \
            https://www.softwareequality.com/aep-x/; do
            ok=0
            for i in 1 2 3 4 5 6; do
              if curl --fail --silent --show-error --location \
                --max-time 10 "$url" | grep -q 'AEP-X'; then
                ok=1
                break
              fi
              sleep 5
            done
            test "$ok" -eq 1
          done
