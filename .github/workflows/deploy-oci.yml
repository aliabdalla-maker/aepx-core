name: Deploy AEP-X GUI to OCI

on:
  push:
    branches: [master]
    paths:
      - 'platform/ecosystem-tracker/**'
      - 'deploy/oci/**'
      - '.github/workflows/deploy-oci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aepx-oci-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]
    environment: production
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate OCI runner and static app
        run: |
          set -euo pipefail
          echo "runner=$(hostname) user=$(id -un) arch=$(uname -m)"
          test -f platform/ecosystem-tracker/index.html
          test -f platform/ecosystem-tracker/data/portals.json
          command -v rsync >/dev/null
          command -v nginx >/dev/null
          command -v curl >/dev/null

      - name: Publish atomically on OCI
        run: |
          set -euo pipefail
          TARGET=/var/www/softwareequality.com/aep-x
          STAGE=/var/www/softwareequality.com/.aep-x-next
          PREV=/var/www/softwareequality.com/aep-x.prev

          sudo rm -rf "$STAGE"
          sudo mkdir -p "$STAGE"
          sudo rsync -a --delete platform/ecosystem-tracker/ "$STAGE/"
          sudo chown -R www-data:www-data "$STAGE"

          sudo rm -rf "$PREV"
          if [ -d "$TARGET" ]; then
            sudo mv "$TARGET" "$PREV"
          fi
          sudo mv "$STAGE" "$TARGET"

          sudo nginx -t
          sudo systemctl reload nginx

      - name: Verify production URL
        run: |
          set -euo pipefail
          for url in \
            https://softwareequality.com/aep-x/ \
            https://www.softwareequality.com/aep-x/; do
            ok=0
            for i in 1 2 3 4 5; do
              if curl --fail --silent --show-error --location "$url" >/dev/null; then
                ok=1
                break
              fi
              sleep 5
            done
            test "$ok" -eq 1
          done
