name: HITL identity role least privilege
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  identity-roles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_hitl_identity_roles_contract.py -v
