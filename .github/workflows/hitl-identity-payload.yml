name: HITL bounded identity payload
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  identity-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_hitl_identity_payload.py -v
