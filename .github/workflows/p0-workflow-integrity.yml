name: P0 workflow integrity gate
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/check_workflow_integrity.py'
      - 'tests/test_workflow_deployment_policy.py'
  push:
    branches: [master]
    paths:
      - '.github/workflows/**'
      - 'scripts/check_workflow_integrity.py'
      - 'tests/test_workflow_deployment_policy.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install 'PyYAML>=6.0,<7'
      - name: Validate workflow YAML and conflict markers
        run: python scripts/check_workflow_integrity.py
      - name: Verify manual-only deployment regression
        run: python -m unittest discover -s tests -p 'test_workflow_deployment_policy.py' -v
