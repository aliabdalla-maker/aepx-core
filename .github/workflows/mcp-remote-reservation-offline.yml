name: MCP remote intent reservation offline
on:
  pull_request:
    paths:
      - 'platform/saas-ide/backend/app/mcp_remote_intent_reservation.py'
      - 'tests/test_mcp_remote_intent_reservation.py'
      - '.github/workflows/mcp-remote-reservation-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Issue #370: bound queue fan-out. One running + one pending run per
  # workflow/event/ref; superseded branch and PR runs are cancelled.
  # master never cancels an in-progress run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  reservation-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compile and run offline reservation tests
        run: |
          python -m py_compile platform/saas-ide/backend/app/mcp_remote_intent_reservation.py
          python -m unittest discover -s tests -p 'test_mcp_remote_intent_reservation.py' -v
