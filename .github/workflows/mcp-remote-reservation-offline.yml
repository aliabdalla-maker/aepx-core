name: MCP remote intent reservation offline
on:
  pull_request:
    paths:
      - 'platform/saas-ide/backend/app/mcp_remote_intent_reservation.py'
      - 'tests/test_mcp_remote_intent_reservation.py'
      - '.github/workflows/mcp-remote-reservation-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reservation-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and run offline reservation tests
        run: |
          python -m py_compile platform/saas-ide/backend/app/mcp_remote_intent_reservation.py
          python -m unittest discover -s tests -p 'test_mcp_remote_intent_reservation.py' -v
