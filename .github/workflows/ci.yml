name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - registry
          - identity
          - trust
          - memory
          - cache
          - gateway
          - discovery
          - workflow
          - safety
          - governance
          - knowledge
          - verification
          - cost-optimiser
          - ml-integration
          - brain
          - oracle-bridge
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install -r services/${{ matrix.service }}/requirements.txt pytest ruff
      - run: pip install fakeredis==2.23.2
        if: matrix.service == 'cache' || matrix.service == 'discovery'
      - run: ruff check services/${{ matrix.service }}
      # run from the service dir — tests import `app.main` relative to it.
      # `python -m pytest` (not bare `pytest`) puts that dir on sys.path so
      # the `app` package is importable.
      - run: cd services/${{ matrix.service }} && python -m pytest tests -v

  test-soa:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        connector:
          - connector-bus
          - connectors/enterprise
          - connectors/productivity
          - connectors/devtools
          - connectors/aiplatform
          - connectors/data
          - connectors/messaging
          - connectors/industrial
          - connectors/cloud
          - connectors/government
          - connectors/education
          - connectors/blockchain
          - sdk/python
          - platform/conformance
          - platform/workbench
          - platform/aepx-console
          - console
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install -r ${{ matrix.connector }}/requirements.txt pytest ruff
      # the SDK's own tests and both platform services import `aepx`
      - run: pip install -e sdk/python
        if: matrix.connector == 'sdk/python' || startsWith(matrix.connector, 'platform/')
      - run: ruff check ${{ matrix.connector }}
      # run from the component dir — tests import `app.main` relative to it.
      # `python -m pytest` (not bare `pytest`) puts that dir on sys.path so
      # the `app` package is importable. sdk/python has no `app` package; its
      # tests import the installed `aepx`, so it works either way.
      - run: cd ${{ matrix.connector }} && python -m pytest tests -v
