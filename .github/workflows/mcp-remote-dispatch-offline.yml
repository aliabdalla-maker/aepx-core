name: MCP remote dispatch offline gate
on:
  pull_request:
    paths:
      - 'platform/saas-ide/backend/app/mcp_remote_dispatch_gate.py'
      - 'tests/test_mcp_remote_dispatch_gate.py'
      - '.github/workflows/mcp-remote-dispatch-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and run offline contract tests
        run: |
          python -m py_compile platform/saas-ide/backend/app/mcp_remote_dispatch_gate.py
          python -m unittest discover -s tests -p 'test_mcp_remote_dispatch_gate.py' -v
