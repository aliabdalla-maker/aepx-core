name: Hybrid IDE Phase 1 checks
on:
  pull_request:
    paths:
      - 'platform/saas-ide/**'
      - '.github/workflows/hybrid-ide-phase1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ide
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ide"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: platform/saas-ide/backend
    env:
      IDE_DATABASE_URL: postgresql+psycopg://ide_runtime:runtime_test_only@localhost:5432/ide
      IDE_TEST_ADMIN_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ide
      IDE_OIDC_ISSUER: https://id.example.test
      IDE_OIDC_JWKS_URL: https://id.example.test/keys
      IDE_OIDC_AUDIENCE: ide-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Provision test-only roles and migration
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d ide -v ON_ERROR_STOP=1 -c "CREATE ROLE ide_runtime LOGIN PASSWORD 'runtime_test_only' NOSUPERUSER NOBYPASSRLS;"
          psql -h localhost -U postgres -d ide -v ON_ERROR_STOP=1 -f migrations/001_phase1.sql
          psql -h localhost -U postgres -d ide -v ON_ERROR_STOP=1 -f migrations/002_phase2.sql
          psql -h localhost -U postgres -d ide -v ON_ERROR_STOP=1 -f migrations/003_phase21.sql
          psql -h localhost -U postgres -d ide -v ON_ERROR_STOP=1 -f migrations/004_phase22.sql
          psql -h localhost -U postgres -d ide -v ON_ERROR_STOP=1 -f migrations/005_phase23.sql
          psql -h localhost -U postgres -d ide -v ON_ERROR_STOP=1 -c "GRANT USAGE ON SCHEMA public TO ide_runtime; GRANT SELECT ON ide_memberships TO ide_runtime; GRANT SELECT, INSERT, UPDATE ON ide_projects, ide_workspace_files, ide_agent_runs TO ide_runtime; GRANT SELECT, INSERT ON ide_knowledge_documents TO ide_runtime; GRANT SELECT, INSERT ON ide_agent_audit TO ide_runtime; GRANT SELECT, INSERT, DELETE ON ide_knowledge_vectors TO ide_runtime; GRANT SELECT, INSERT, UPDATE ON ide_agent_jobs, ide_tool_approvals TO ide_runtime; GRANT SELECT, INSERT, UPDATE ON ide_agent_spend TO ide_runtime; GRANT SELECT, UPDATE ON ide_agent_budgets TO ide_runtime;"
      - run: python -m pytest tests -v
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: platform/saas-ide/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_OIDC_AUTHORITY: https://id.example.test
          NEXT_PUBLIC_OIDC_CLIENT_ID: ide-browser
          NEXT_PUBLIC_IDE_TENANT: demo-tenant
          NEXT_PUBLIC_IDE_API_URL: http://localhost:8090
