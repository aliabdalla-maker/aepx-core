name: Hybrid IDE Phase 1 checks
on:
  pull_request:
    paths:
      - 'platform/saas-ide/**'
      - '.github/workflows/hybrid-ide-phase1.yml'
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/saas-ide/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests -v
        env:
          IDE_DATABASE_URL: postgresql+psycopg://unused:unused@localhost/unused
          IDE_OIDC_ISSUER: https://id.example.test
          IDE_OIDC_JWKS_URL: https://id.example.test/keys
          IDE_OIDC_AUDIENCE: ide-api
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/saas-ide/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_OIDC_AUTHORITY: https://id.example.test
          NEXT_PUBLIC_OIDC_CLIENT_ID: ide-browser
          NEXT_PUBLIC_IDE_TENANT: demo-tenant
          NEXT_PUBLIC_IDE_API_URL: http://localhost:8090
