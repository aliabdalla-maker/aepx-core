name: Sequential 1000-pass HITL acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hitl-sequential-1000
  cancel-in-progress: false
jobs:
  sequential:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r services/governance/requirements.txt pytest httpx
      - name: Run strict 1-to-1000 serial acceptance
        env:
          AEPX_SEQUENTIAL_ACCEPTANCE_APPROVED: 'yes'
          PYTHONPATH: services/governance
        run: python scripts/sequential_acceptance_1000.py
      - name: Upload all per-batch reports and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sequential-1000-evidence
          path: artifacts/sequential-1000/
          if-no-files-found: warn
