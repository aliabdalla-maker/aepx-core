name: AEP-X autonomous checkpoint security
on:
  pull_request:
    paths:
      - 'scripts/aepx_autonomous_checkpoint.py'
      - 'tests/test_aepx_autonomous_checkpoint.py'
      - '.github/workflows/aepx-autonomous-checkpoint.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify offline checkpoint security
        run: python -m unittest discover -s tests -p 'test_aepx_autonomous_checkpoint.py' -v
