name: HITL cryptographic bearer identity
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  bearer-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest 'PyJWT[crypto]'
      - run: python -m pytest -q tests/test_hitl_verified_bearer_identity.py tests/test_hitl_verified_jti.py
