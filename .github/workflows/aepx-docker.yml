name: AEP-X Docker build and GHCR publish

on:
  pull_request:
    paths:
      - 'docker-compose.yml'
      - 'platform/aepx-console/**'
      - '.github/workflows/aepx-docker.yml'
  push:
    branches: [master]
    paths:
      - 'docker-compose.yml'
      - 'platform/aepx-console/**'
      - '.github/workflows/aepx-docker.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the AEP-X console image to GHCR'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate existing AEP-X Compose stack
        run: docker compose -f docker-compose.yml config --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build existing AEP-X console
        uses: docker/build-push-action@v6
        with:
          context: .
          file: platform/aepx-console/Dockerfile
          push: false
          tags: aepx-console:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Login to GitHub Container Registry
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish console image
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: platform/aepx-console/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/aepx-console:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
