name: AEP-X GitHub-only validation control plane
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/aepx-github-only-validation.yml'
      - 'docs/AEPX-GITHUB-ONLY-RUNBOOK.md'
      - 'scripts/actions-queue-inspector.py'
      - 'tests/test_actions_queue_inspector.py'
      - 'scripts/github-release-evidence.py'
      - 'tests/test_github_release_evidence.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: aepx-github-only-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-control-plane:
    name: Offline policy and workflow validation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actionlint (version-pinned)
        env:
          ACTIONLINT_VERSION: '1.7.7'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/actionlint.tar.gz
          mkdir -p /tmp/actionlint
          tar -xzf /tmp/actionlint.tar.gz -C /tmp/actionlint actionlint
          /tmp/actionlint/actionlint -version
          /tmp/actionlint/actionlint -color
      - name: Run fail-closed Actions evidence regression tests
        run: python -m unittest discover -s tests -p 'test_actions_sample_gate.py' -v
      - name: Run release evidence and queue inspector regression tests
        run: |
          python -m unittest discover -s tests -p 'test_github_release_evidence.py' -v
          python -m unittest discover -s tests -p 'test_actions_queue_inspector.py' -v
      - name: Validate milestone report
        run: |
          python scripts/aepx-progress.py --validate
          python scripts/aepx-progress.py --output "$RUNNER_TEMP/aepx-progress.md"
          cat "$RUNNER_TEMP/aepx-progress.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload milestone report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aepx-github-only-progress
          path: ${{ runner.temp }}/aepx-progress.md
          if-no-files-found: warn
          retention-days: 7
  queue-evidence:
    name: Read-only GitHub Actions queue evidence
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect recent workflow runs and job assignment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import collections, datetime, json, os, urllib.request
          repo = os.environ["GH_REPO"]
          token = os.environ["GH_TOKEN"]
          headers = {"Authorization": "Bearer " + token,
                     "Accept": "application/vnd.github+json",
                     "User-Agent": "aepx-github-only-evidence"}
          def fetch(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=20) as response:
                  return json.load(response)
          runs = fetch(f"https://api.github.com/repos/{repo}/actions/runs?per_page=50").get("workflow_runs", [])
          counts = collections.Counter((r.get("status"), r.get("conclusion")) for r in runs)
          lines = ["# GitHub-hosted Actions diagnostics", "",
                   f"Sampled runs: {len(runs)}", "",
                   "| Status | Conclusion | Count |", "|---|---|---:|"]
          for (status, conclusion), count in sorted(counts.items(), key=lambda item: str(item[0])):
              lines.append(f"| {status} | {conclusion or '-'} | {count} |")
          now = datetime.datetime.now(datetime.timezone.utc)
          lines += ["", "## Queued runs and runner assignment (first five)"]
          for run in [r for r in runs if r.get("status") == "queued"][:5]:
              created = datetime.datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))
              age = int((now - created).total_seconds() // 60)
              jobs = fetch(f"https://api.github.com/repos/{repo}/actions/runs/{run['id']}/jobs?per_page=20").get("jobs", [])
              assigned = sum(job.get("runner_id") is not None for job in jobs)
              lines.append(f"- Run {run['id']}: queued {age} min; jobs={len(jobs)}; assigned={assigned}")
          lines += ["", "No root cause is inferred from queue state alone.",
                    "If this job never starts, inspect Actions policy, runner eligibility, billing limits and GitHub Status in the GitHub UI."]
          summary = "\n".join(lines) + "\n"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(summary)
          PY
