name: AEP-X GitHub-only validation control plane
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/aepx-github-only-validation.yml'
      - 'docs/AEPX-GITHUB-ONLY-RUNBOOK.md'
      - 'scripts/actions-queue-inspector.py'
      - 'tests/test_actions_queue_inspector.py'
      - 'scripts/github-release-evidence.py'
      - 'tests/test_github_release_evidence.py'
      - 'scripts/aepx_supervised_batch.py'
      - 'tests/test_aepx_supervised_batch.py'
      - 'scripts/aepx_budget_admission.py'
      - 'tests/test_aepx_budget_admission.py'
      - 'docker/offline-pilot/Dockerfile'
      - 'scripts/run_aepx_offline_docker.sh'
      - 'tests/test_aepx_docker_pilot_static.py'
      - 'tests/test_aepx_docker_launcher_counts.py'
      - 'tests/test_aepx_docker_launcher_contract.py'
      - 'tests/test_aepx_docker_isolated_imports.py'
      - 'tests/test_aepx_docker_entrypoint_smoke_contract.py'
      - 'tests/test_aepx_engineering_iteration_state.py'
      - 'tests/test_aepx_engineering_iteration_capacity.py'
      - 'platform/saas-ide/backend/sql/aepx_iteration_fenced.sql'
      - 'tests/test_aepx_pg_iteration_fencing_contract.py'
      - 'tests/test_aepx_pg_iteration_renewal_contract.py'
      - 'tests/sql/aepx_iteration_pg_acceptance.sql'
      - 'scripts/test_aepx_pg_iteration_acceptance.sh'
      - 'tests/test_aepx_pg_iteration_acceptance_contract.py'
      - 'tests/test_aepx_pg_completion_gate_contract.py'
      - 'tests/test_aepx_pg_stage_digest_contract.py'
      - 'tests/test_aepx_engineering_iteration_lock.py'
      - 'tests/test_aepx_engineering_evidence.py'
      - 'tests/test_aepx_reviewed_evidence.py'
      - 'scripts/aepx_reviewed_evidence_attestation.py'
      - 'tests/test_aepx_reviewed_evidence_attestation.py'
      - 'platform/saas-ide/backend/sql/aepx_iteration_approval_nonce.sql'
      - 'tests/test_aepx_pg_approval_nonce_contract.py'
      - 'tests/sql/aepx_approval_nonce_pg_acceptance.sql'
      - 'scripts/test_aepx_pg_approval_nonce_acceptance.sh'
      - 'tests/test_aepx_pg_approval_acceptance_contract.py'
      - 'scripts/test_aepx_pg_approval_concurrency.py'
      - 'tests/test_aepx_pg_approval_race_contract.py'
      - 'tests/test_aepx_pg_approval_race_bounded.py'
      - 'tests/sql/aepx_runtime_role_privilege_audit.sql'
      - 'scripts/test_aepx_pg_runtime_privileges.sh'
      - 'tests/test_aepx_pg_runtime_privilege_audit_contract.py'
      - 'tests/sql/aepx_runtime_function_grant_audit.sql'
      - 'scripts/test_aepx_pg_function_grants.sh'
      - 'tests/test_aepx_pg_function_grants_contract.py'
      - 'tests/sql/aepx_security_definer_audit.sql'
      - 'scripts/test_aepx_pg_security_definer.sh'
      - 'tests/test_aepx_pg_security_definer_contract.py'
      - 'tests/test_aepx_pg_definer_audit_coverage.py'
      - 'scripts/aepx_trusted_tenant_context.py'
      - 'tests/test_aepx_trusted_tenant_context.py'
      - 'tests/test_aepx_engineering_evidence_mutation.py'
      - 'scripts/aepx_engineering_evidence.py'
      - 'scripts/aepx_engineering_iteration_state.py'
      - 'scripts/test_aepx_docker_entrypoint_runtime.sh'
      - 'tests/test_aepx_budget_pg_sql_contract.py'
      - 'tests/test_aepx_pg_budget_acceptance_contract.py'
      - 'tests/test_aepx_pg_rls_preflight.py'
      - 'tests/test_aepx_pg_settled_replay_contract.py'
      - 'scripts/aepx_provider_dispatch_admission.py'
      - 'tests/test_aepx_provider_dispatch_admission.py'
      - 'scripts/aepx_signed_dispatch_approval.py'
      - 'tests/test_aepx_signed_dispatch_approval.py'
      - 'tests/sql/aepx_budget_pg_acceptance.sql'
      - 'scripts/test_aepx_pg_budget_acceptance.sh'
      - 'platform/saas-ide/backend/sql/aepx_budget_transactional.sql'
      - 'scripts/aepx_budget_ledger.py'
      - 'tests/test_aepx_budget_ledger.py'
      - 'tests/test_aepx_pilot_standalone_lock.py'
      - 'scripts/aepx_autonomous_pilot.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: aepx-github-only-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-control-plane:
    name: Offline policy and workflow validation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actionlint (version-pinned)
        env:
          ACTIONLINT_VERSION: '1.7.7'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/actionlint.tar.gz
          mkdir -p /tmp/actionlint
          tar -xzf /tmp/actionlint.tar.gz -C /tmp/actionlint actionlint
          /tmp/actionlint/actionlint -version
          /tmp/actionlint/actionlint -color
      - name: Run fail-closed Actions evidence regression tests
        run: python -m unittest discover -s tests -p 'test_actions_sample_gate.py' -v
      - name: Run release evidence and queue inspector regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_github_release_evidence.py' -v
          python -m unittest discover -s tests -p 'test_actions_queue_inspector.py' -v
      - name: Test standalone checkpoint coordination (mocked, offline)
        run: python -m unittest discover -s tests -p 'test_aepx_pilot_standalone_lock.py' -v
      - name: Test offline persistent budget reservations
        run: python -m unittest discover -s tests -p 'test_aepx_budget_ledger.py' -v
      - name: Test signed offline dispatch approval verification
        run: python -m unittest discover -s tests -p 'test_aepx_signed_dispatch_approval.py' -v
      - name: Test offline provider dispatch admission policy
        run: python -m unittest discover -s tests -p 'test_aepx_provider_dispatch_admission.py' -v
      - name: Test PostgreSQL settled reservation replay contract
        run: python -m unittest discover -s tests -p 'test_aepx_pg_settled_replay_contract.py' -v
      - name: Test PostgreSQL RLS preflight contract (offline)
        run: python -m unittest discover -s tests -p 'test_aepx_pg_rls_preflight.py' -v
      - name: Test PostgreSQL acceptance script contract (offline)
        run: python -m unittest discover -s tests -p 'test_aepx_pg_budget_acceptance_contract.py' -v
      - name: Test PostgreSQL budget SQL static contract
        run: python -m unittest discover -s tests -p 'test_aepx_budget_pg_sql_contract.py' -v
      - name: Test concurrent evidence mutation detection
        run: python -m unittest discover -s tests -p 'test_aepx_engineering_evidence_mutation.py' -v
      - name: Test trusted tenant context contract (offline)
        run: python -m unittest discover -s tests -p 'test_aepx_trusted_tenant_context.py' -v
      - name: Test SECURITY DEFINER audit coverage (offline)
        run: python -m unittest discover -s tests -p 'test_aepx_pg_definer_audit_coverage.py' -v
      - name: Test SECURITY DEFINER audit guardrails (offline)
        run: python -m unittest discover -s tests -p 'test_aepx_pg_security_definer_contract.py' -v
      - name: Test PostgreSQL schema and function grant audit guardrails (offline)
        run: python -m unittest discover -s tests -p 'test_aepx_pg_function_grants_contract.py' -v
      - name: Test PostgreSQL runtime privilege audit guardrails (offline)
        run: python -m unittest discover -s tests -p 'test_aepx_pg_runtime_privilege_audit_contract.py' -v
      - name: Test bounded approval race harness (offline)
        run: python -m unittest discover -s tests -p 'test_aepx_pg_approval_race_bounded.py' -v
      - name: Test concurrent approval replay harness guardrails (offline)
        run: python -m unittest discover -s tests -p 'test_aepx_pg_approval_race_contract.py' -v
      - name: Test approval nonce acceptance guardrails (offline)
        run: python -m unittest discover -s tests -p 'test_aepx_pg_approval_acceptance_contract.py' -v
      - name: Test single-use PostgreSQL approval nonce contract (offline)
        run: python -m unittest discover -s tests -p 'test_aepx_pg_approval_nonce_contract.py' -v
      - name: Test signed reviewed evidence attestation (offline)
        run: python -m unittest discover -s tests -p 'test_aepx_reviewed_evidence_attestation.py' -v
      - name: Test pre-completion reviewed artifact evidence verification
        run: python -m unittest discover -s tests -p 'test_aepx_reviewed_evidence.py' -v
      - name: Test offline engineering evidence verification
        run: python -m unittest discover -s tests -p 'test_aepx_engineering_evidence.py' -v
      - name: Test PostgreSQL stage evidence SHA256 format
        run: python -m unittest discover -s tests -p 'test_aepx_pg_stage_digest_contract.py' -v
      - name: Test fail-closed PostgreSQL iteration completion gate
        run: python -m unittest discover -s tests -p 'test_aepx_pg_completion_gate_contract.py' -v
      - name: Test PostgreSQL iteration acceptance guardrails (offline)
        run: python -m unittest discover -s tests -p 'test_aepx_pg_iteration_acceptance_contract.py' -v
      - name: Test PostgreSQL lease renewal static contract
        run: python -m unittest discover -s tests -p 'test_aepx_pg_iteration_renewal_contract.py' -v
      - name: Test PostgreSQL iteration fencing static contract
        run: python -m unittest discover -s tests -p 'test_aepx_pg_iteration_fencing_contract.py' -v
      - name: Test full 10,000-iteration ledger capacity
        run: python -m unittest discover -s tests -p 'test_aepx_engineering_iteration_capacity.py' -v
      - name: Test locked engineering iteration transitions
        run: python -m unittest discover -s tests -p 'test_aepx_engineering_iteration_lock.py' -v
      - name: Test offline engineering iteration state machine
        run: python -m unittest discover -s tests -p 'test_aepx_engineering_iteration_state.py' -v
      - name: Test real Docker entrypoint smoke script guardrails (no Docker)
        run: python -m unittest discover -s tests -p 'test_aepx_docker_entrypoint_smoke_contract.py' -v
      - name: Test isolated Python Docker entrypoint import (no Docker)
        run: python -m unittest discover -s tests -p 'test_aepx_docker_isolated_imports.py' -v
      - name: Test Docker launcher command contract (fake Docker)
        run: python -m unittest discover -s tests -p 'test_aepx_docker_launcher_contract.py' -v
      - name: Test Docker launcher count admission (no Docker invocation)
        run: python -m unittest discover -s tests -p 'test_aepx_docker_launcher_counts.py' -v
      - name: Test Docker offline pilot static guardrails
        run: python -m unittest discover -s tests -p 'test_aepx_docker_pilot_static.py' -v
      - name: Test offline autonomous budget admission
        run: python -m unittest discover -s tests -p 'test_aepx_budget_admission.py' -v
      - name: Test bounded supervised pilot (mocked, offline)
        run: python -m unittest discover -s tests -p 'test_aepx_supervised_batch.py' -v
      - name: Validate milestone report
        run: |
          python scripts/aepx-progress.py --validate
          python scripts/aepx-progress.py --output "$RUNNER_TEMP/aepx-progress.md"
          cat "$RUNNER_TEMP/aepx-progress.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload milestone report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aepx-github-only-progress
          path: ${{ runner.temp }}/aepx-progress.md
          if-no-files-found: warn
          retention-days: 7
  queue-evidence:
    name: Read-only GitHub Actions queue evidence
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect queue with validated evidence parser
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/actions-queue-inspector.py --repo "$GH_REPO" --output "$RUNNER_TEMP/aepx-queue-evidence.json"
          {
            echo "## Read-only Actions queue evidence"
            echo '~~~json'
            cat "$RUNNER_TEMP/aepx-queue-evidence.json"
            echo '~~~'
            echo "Queue state alone does not establish a runner root cause or release approval."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload queue evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aepx-queue-evidence
          path: ${{ runner.temp }}/aepx-queue-evidence.json
          if-no-files-found: warn
          retention-days: 7
