name: AEP-X GitHub-only validation control plane
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/aepx-github-only-validation.yml'
      - 'docs/AEPX-GITHUB-ONLY-RUNBOOK.md'
      - 'scripts/actions-queue-inspector.py'
      - 'tests/test_actions_queue_inspector.py'
      - 'scripts/github-release-evidence.py'
      - 'tests/test_github_release_evidence.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: aepx-github-only-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-control-plane:
    name: Offline policy and workflow validation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actionlint (version-pinned)
        env:
          ACTIONLINT_VERSION: '1.7.7'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/actionlint.tar.gz
          mkdir -p /tmp/actionlint
          tar -xzf /tmp/actionlint.tar.gz -C /tmp/actionlint actionlint
          /tmp/actionlint/actionlint -version
          /tmp/actionlint/actionlint -color
      - name: Run fail-closed Actions evidence regression tests
        run: python -m unittest discover -s tests -p 'test_actions_sample_gate.py' -v
      - name: Run release evidence and queue inspector regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_github_release_evidence.py' -v
          python -m unittest discover -s tests -p 'test_actions_queue_inspector.py' -v
      - name: Validate milestone report
        run: |
          python scripts/aepx-progress.py --validate
          python scripts/aepx-progress.py --output "$RUNNER_TEMP/aepx-progress.md"
          cat "$RUNNER_TEMP/aepx-progress.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload milestone report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aepx-github-only-progress
          path: ${{ runner.temp }}/aepx-progress.md
          if-no-files-found: warn
          retention-days: 7
  queue-evidence:
    name: Read-only GitHub Actions queue evidence
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect queue with validated evidence parser
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/actions-queue-inspector.py --repo "$GH_REPO" --output "$RUNNER_TEMP/aepx-queue-evidence.json"
          {
            echo "## Read-only Actions queue evidence"
            echo '~~~json'
            cat "$RUNNER_TEMP/aepx-queue-evidence.json"
            echo '~~~'
            echo "Queue state alone does not establish a runner root cause or release approval."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload queue evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aepx-queue-evidence
          path: ${{ runner.temp }}/aepx-queue-evidence.json
          if-no-files-found: warn
          retention-days: 7
