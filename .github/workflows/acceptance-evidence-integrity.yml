name: AEP-X acceptance evidence integrity
on:
  push:
    branches:
      - 'fix/acceptance-evidence-gates-20261114'
    paths:
      - 'tools/verify_acceptance_evidence.py'
      - 'tests/test_acceptance_evidence_integrity.py'
      - '.github/workflows/acceptance-evidence-integrity.yml'
      - 'docs/acceptance-evidence-gate.md'
  pull_request:
    paths:
      - 'tools/verify_acceptance_evidence.py'
      - 'tests/test_acceptance_evidence_integrity.py'
      - '.github/workflows/acceptance-evidence-integrity.yml'
      - 'docs/acceptance-evidence-gate.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-evidence-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preflight Python syntax and test discovery
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/verify_acceptance_evidence.py tests/test_acceptance_evidence_integrity.py
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover(
              start_dir='tests', pattern='test_acceptance_evidence_integrity.py')
          count = suite.countTestCases()
          print(f'Discovered {count} acceptance integrity tests')
          if count < 29:
              raise SystemExit(f'Expected at least 29 tests, discovered {count}')
          PY
      - name: Run offline fail-closed evidence regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_acceptance_evidence_integrity.py' -v 2>&1 | tee /tmp/aepx-unittest.log
      - name: Verify CLI rejects absent manifest
        shell: bash
        run: |
          set +e
          python tools/verify_acceptance_evidence.py /tmp/aepx-missing-manifest.json > /tmp/aepx-gate.out 2>&1
          status=$?
          set -e
          test "$status" -eq 2
          grep -q "acceptance evidence rejected" /tmp/aepx-gate.out
      - name: Reject empty milestone manifest at CLI boundary
        shell: bash
        run: |
          printf '{"milestones":[]}' > /tmp/aepx-empty-manifest.json
          set +e
          python tools/verify_acceptance_evidence.py /tmp/aepx-empty-manifest.json > /tmp/aepx-gate.out 2>&1
          status=$?
          set -e
          test "$status" -eq 2
          grep -q "acceptance evidence rejected" /tmp/aepx-gate.out
      - name: Verify incomplete evidence returns exit code one
        shell: bash
        run: |
          printf '{"milestones":[{"id":"rls","weight":100,"evidence":[{"path":"absent.txt","sha256":"%064d","result":"pass"}]}]}' 0 > /tmp/aepx-incomplete-manifest.json
          set +e
          python tools/verify_acceptance_evidence.py /tmp/aepx-incomplete-manifest.json > /tmp/aepx-incomplete.out 2>&1
          status=$?
          set -e
          test "$status" -eq 1
          grep -q '"evidence_integrity_percent": 0' /tmp/aepx-incomplete.out
      - name: Verify valid local digest does not claim independent acceptance
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('/tmp/aepx-gate-positive')
          root.mkdir(exist_ok=True)
          payload = b'local-integrity-only'
          (root / 'proof.txt').write_bytes(payload)
          manifest = {'milestones': [{'id': 'offline', 'weight': 100, 'evidence': [
              {'path': 'proof.txt', 'sha256': hashlib.sha256(payload).hexdigest(), 'result': 'pass'}
          ]}]}
          (root / 'manifest.json').write_text(json.dumps(manifest))
          PY
          python tools/verify_acceptance_evidence.py /tmp/aepx-gate-positive/manifest.json > /tmp/aepx-gate-positive.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/aepx-gate-positive.json').read_text())
          assert result['evidence_integrity_percent'] == 100
          assert result['independently_verified_percent'] == 0
          assert result['independent_verification_available'] is False
          PY
      - name: Verify invalid UTF-8 manifest returns exit code two
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          Path('/tmp/aepx-invalid-utf8.json').write_bytes(bytes([255, 254]))
          PY
          set +e
          python tools/verify_acceptance_evidence.py /tmp/aepx-invalid-utf8.json > /tmp/aepx-invalid-utf8.out 2>&1
          status=$?
          set -e
          test "$status" -eq 2
          grep -q 'acceptance evidence rejected' /tmp/aepx-invalid-utf8.out
      - name: Reject cross-milestone evidence reuse at CLI boundary
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path('/tmp/aepx-reused-evidence')
          root.mkdir(exist_ok=True)
          (root / 'proof.txt').write_bytes(b'proof')
          entry = {'path': 'proof.txt', 'sha256': hashlib.sha256(b'proof').hexdigest(),
                   'result': 'pass'}
          (root / 'manifest.json').write_text(json.dumps({'milestones': [
              {'id': 'rls', 'weight': 50, 'evidence': [entry]},
              {'id': 'oidc', 'weight': 50, 'evidence': [entry]}
          ]}))
          PY
          set +e
          python tools/verify_acceptance_evidence.py /tmp/aepx-reused-evidence/manifest.json > /tmp/aepx-reuse.out 2>&1
          status=$?
          set -e
          test "$status" -eq 2
          grep -q 'duplicate evidence path rejected' /tmp/aepx-reuse.out
      - name: Reject forged acceptance schema fields at CLI boundary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/aepx-unknown-schema')
          root.mkdir(exist_ok=True)
          (root / 'manifest.json').write_text(json.dumps({
              'milestones': [{'id': 'rls', 'weight': 100, 'evidence': []}],
              'independently_verified_percent': 100
          }))
          PY
          set +e
          python tools/verify_acceptance_evidence.py /tmp/aepx-unknown-schema/manifest.json > /tmp/aepx-schema.out 2>&1
          status=$?
          set -e
          test "$status" -eq 2
          grep -q 'unexpected manifest fields' /tmp/aepx-schema.out
      - name: Reject hard-linked evidence at CLI boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path('/tmp/aepx-hardlink-evidence')
          root.mkdir(exist_ok=True)
          (root / 'source.txt').write_bytes(b'proof')
          os.link(root / 'source.txt', root / 'proof.txt')
          (root / 'manifest.json').write_text(json.dumps({'milestones': [{
              'id': 'rls', 'weight': 100, 'evidence': [{
                  'path': 'proof.txt',
                  'sha256': hashlib.sha256(b'proof').hexdigest(),
                  'result': 'pass'
              }]
          }]}))
          PY
          set +e
          python tools/verify_acceptance_evidence.py /tmp/aepx-hardlink-evidence/manifest.json > /tmp/aepx-hardlink.out 2>&1
          status=$?
          set -e
          test "$status" -eq 1
          python - <<'PY'
          import json
          from pathlib import Path
          output = json.loads(Path('/tmp/aepx-hardlink.out').read_text())
          assert output['evidence_integrity_percent'] == 0
          assert output['independently_verified_percent'] == 0
          PY
      - name: Publish clearly scoped CI summary
        if: always()
        shell: bash
        run: |
          {
            echo '## AEP-X offline evidence gate'
            echo
            echo "- Repository: ${GITHUB_REPOSITORY}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Job outcome: ${{ job.status }}"
            echo "- Scope: offline verifier regressions and CLI contract only"
            echo "- Independent acceptance: **NOT ESTABLISHED**"
            echo "- Production deployment authorized: **NO**"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload offline diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aepx-offline-evidence-diagnostics
          retention-days: 7
          if-no-files-found: warn
          path: |
            /tmp/aepx-unittest.log
            /tmp/aepx-gate.out
            /tmp/aepx-incomplete.out
            /tmp/aepx-gate-positive.json
            /tmp/aepx-invalid-utf8.out
            /tmp/aepx-reuse.out
            /tmp/aepx-schema.out
            /tmp/aepx-hardlink.out
