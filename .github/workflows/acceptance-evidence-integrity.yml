name: AEP-X acceptance evidence integrity
on:
  pull_request:
    paths:
      - 'tools/verify_acceptance_evidence.py'
      - 'tests/test_acceptance_evidence_integrity.py'
      - '.github/workflows/acceptance-evidence-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-evidence-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline fail-closed evidence regressions
        run: python -m unittest discover -s tests -p 'test_acceptance_evidence_integrity.py' -v
