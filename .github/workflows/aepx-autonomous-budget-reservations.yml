name: AEP-X transactional budget reservations
on:
  pull_request:
    paths:
      - 'scripts/aepx_autonomous_budget_reservations.py'
      - 'tests/test_aepx_autonomous_budget_reservations.py'
      - '.github/workflows/aepx-autonomous-budget-reservations.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify transactional budget reservations
        run: python -m unittest discover -s tests -p 'test_aepx_autonomous_budget_reservations.py' -v
