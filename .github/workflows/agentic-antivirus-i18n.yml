# Agentic Antivirus: machine-translate the console catalogue into all 99 non-English locales
# (L10N-01, L10N-11, L10N-12). Uses the Claude API when the ANTHROPIC_API_KEY secret exists, otherwise
# free open models on the runner (M2M100, MIT; MADLAD-400, Apache-2.0). Output files are labelled
# "machine translated, not yet reviewed" and arrive as a pull request; a person merges it (CI-13).
name: agentic-antivirus-i18n
on:
  workflow_dispatch:
    inputs:
      engine:
        description: "auto = Claude if the secret exists, else open models"
        default: auto
        type: choice
        options: [auto, claude, m2m100, madlad]
  push:
    branches: [master]
    paths: ["products/agentic-antivirus/shared/i18n/en.json"]
permissions:
  contents: read
concurrency:
  group: aav-i18n
  cancel-in-progress: false
env:
  P: products/agentic-antivirus
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        shard:
          - es,zh-Hans,hi,ar,fr,pt,ru,bn,id,ur
          - de,ja,sw,mr,te,tr,ta,vi,ko,it
          - th,gu,fa,pl,uk,pa,ml,jv,nl,ro
          - hu,el,cs,sv,fi,he,da,no,sk,bg
          - sr,hr,lt,lv,et,sl,ca,eu,gl,af
          - am,az,be,bs,cy,eo,fil,ha,hy,ig
          - is,ka,kk,km,kn,ku,ky,lo,mk,mn
          - my,ne,or,ps,si,sq,su,tg,tk,tl
          - uz,yo,zu,xh,so,rw,mg,ny,sn,st
          - tn,ts,wo,yi,ceb,hmn,bho,mai,sat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install (CPU-only torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install transformers==4.46.3 sentencepiece==0.2.0 httpx==0.28.1 fastapi pydantic
      - name: Translate shard
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          cd $P
          python tools/i18n_translate.py --locales "${{ matrix.shard }}" --engine "${{ inputs.engine || 'auto' }}" \
            | tee "$RUNNER_TEMP/report.json"
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          rows = json.load(open(os.environ["RUNNER_TEMP"] + "/report.json"))
          print("| locale | engine | translated | dropped (placeholder check) | present / total |\n|---|---|---|---|---|")
          for r in rows:
              print(f"| {r['locale']} | {r.get('engine', r.get('skipped'))} | {r.get('translated', 0)} | "
                    f"{r.get('dropped_placeholder_mismatch', 0)} | {r.get('keys_present', 0)} / {r.get('keys_total', 0)} |")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: i18n-${{ strategy.job-index }}
          path: ${{ env.P }}/shared/i18n/*.json
          retention-days: 7
  pull-request:
    needs: translate
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: "${{ runner.temp }}/i18n", pattern: "i18n-*" }
      - name: Collect locale files (en.json stays as committed)
        run: |
          for d in "$RUNNER_TEMP"/i18n/i18n-*; do
            for f in "$d"/*.json; do [ "$(basename "$f")" = en.json ] || cp "$f" "$P/shared/i18n/"; done
          done
          ls "$P/shared/i18n" | wc -l
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: aav/i18n-machine-translations
          title: "AAV: machine translations for 99 locales (labelled, not yet reviewed)"
          commit-message: "AAV: machine translations for 99 locales (labelled, not yet reviewed)"
          body: |
            Generated by `agentic-antivirus-i18n` from `shared/i18n/en.json`.
            Every file carries `_meta.origin = machine:catalogue` and the console shows a
            "machine translated, not yet reviewed" notice until a reviewer approves keys
            (`POST /v1/i18n/review` or `_meta.reviewed_keys`). Strings whose placeholders did not
            survive translation are omitted, so English is shown for them.
            See the run summary for per-locale counts.
          add-paths: ${{ env.P }}/shared/i18n/*.json
