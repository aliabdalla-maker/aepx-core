name: HITL offline sandbox unit tests
on:
  pull_request:
    paths:
      - 'services/governance/app/hitl_offline_*.py'
      - 'tests/test_hitl_offline_*.py'
      - '.github/workflows/hitl-offline-sandbox.yml'
  push:
    branches: [master]
    paths:
      - 'services/governance/app/hitl_offline_*.py'
      - 'tests/test_hitl_offline_*.py'
      - '.github/workflows/hitl-offline-sandbox.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hitl-offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile sandbox modules
        run: python -m compileall -q services/governance/app/hitl_offline_container_policy.py services/governance/app/hitl_offline_supervisor_plan.py services/governance/app/hitl_offline_cleanup_verification.py
      - name: Run offline unit tests (no Docker execution)
        run: |
          python -m unittest discover -s tests -p 'test_hitl_offline_container_policy.py' -v
          python -m unittest discover -s tests -p 'test_hitl_offline_supervisor_plan.py' -v
          python -m unittest discover -s tests -p 'test_hitl_offline_cleanup_verification.py' -v
